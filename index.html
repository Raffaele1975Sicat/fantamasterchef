  /* ============ render: concorrenti ============ */
  function renderConcorrenti(){
    var html = '<div class="section-head"><div><h2>Chef</h2><p class="section-sub">Tocca uno Chef per la scheda.</p></div></div>';
    var rows = state.concorrenti.slice().sort(function(a,b){
      return concorrenteCumulativo(b.id)-concorrenteCumulativo(a.id) || String(a.nome).localeCompare(String(b.nome));
    });
    html += '<div class="card" style="padding:4px 0;">';
    rows.forEach(function(c){
      var open = state._expandedConc===c.id;
      html += '<div class="chip-row" data-conc-row="'+c.id+'">'
        + '<div class="chip-row-name">'+esc(c.nome)+(c.eliminato?' <span class="badge warn">Eliminato</span>':' <span class="badge ok">In gara</span>')+'</div>'
        + '<div class="chip-row-points">'+fmtNum(concorrenteCumulativo(c.id))+'</div>'
        + '<div class="chip-row-chevron">'+(open?'⌃':'›')+'</div>'
        + '</div>';
      if (open){
        html += '<div style="padding:2px 14px 18px;border-bottom:1px solid var(--line);">'+concorrenteDetailHtml(c)+'</div>';
      }
    });
    html += '</div>';
    document.getElementById("panel-concorrenti").innerHTML = html;
    bindConcorrentiEvents();
  }
  function concorrenteDetailHtml(c){
    var confirmed = state.episodes.filter(function(e){ return e.confermata; }).slice().sort(function(a,b){ return a.numero-b.numero; });
    if (!confirmed.length){ return '<span class="muted">Nessuna puntata confermata ancora.</span>'; }
    var running = 0;
    var series = [];
    var rowsHtml = confirmed.map(function(ep){
      var e = eventFor(ep.id, c.id);
      var bp = basePoints(ep.id, c.id);
      running += bp.bonus + bp.penalty;
      series.push({y:running});
      if (!e) return '<tr><td>Puntata '+ep.numero+'</td><td colspan="2" class="muted">Non in gara / nessun dato</td><td class="num">'+fmtNum(0)+'</td></tr>';
      var bonusStr = [e.mystery_box&&"Mystery Box", e.vince_esterna&&"Esterna", e.vince_cucina&&"Cucina", e.miglior_piatto&&"Miglior piatto"].filter(Boolean).join(", ") || "—";
      var penStr = e.penalita==="nero" ? "Grembiule Nero" : (e.penalita==="esterna" ? "Persa Esterna" : "—");
      return '<tr><td>Puntata '+ep.numero+'</td><td>'+esc(bonusStr)+'</td><td>'+esc(penStr)+'</td><td class="num">'+fmtNum(bp.bonus+bp.penalty)+'</td></tr>';
    }).join("");
    return '<div class="section-sub" style="margin-bottom:4px;">Andamento punti</div>'
      + '<div style="margin-bottom:10px;">'+svgLineChart(series, {width:500, height:80})+'</div>'
      + '<div class="table-wrap"><table><thead><tr><th>Puntata</th><th>Bonus</th><th>Penalità</th><th class="num">Punti</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
  }
  function bindConcorrentiEvents(){
    document.querySelectorAll("[data-conc-row]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-conc-row");
        state._expandedConc = (state._expandedConc===id) ? null : id;
        renderConcorrenti();
      });
    });
  }

  /* ============ render: puntate ============ */
  function renderPuntate(){
    if (!state._puntateExpanded) state._puntateExpanded = {};
    var html = '<div class="screen-head"><img src="char-dettaglio.png" alt="" class="screen-head-icon"><div><h2>Puntate</h2><p class="section-sub">Risultati puntata per puntata.</p></div></div>';
    var episodes = state.episodes.filter(function(e){ return state.profile.is_admin || e.confermata; }).slice().sort(function(a,b){return b.numero-a.numero;});
    if (!episodes.length){ html += '<div class="card empty" style="text-align:center;"><img src="char-vuoto.png" alt="" class="hero-illus sm">Nessuna puntata ancora confermata.</div>'; }
    episodes.forEach(function(ep, idx){
      var stored = state._puntateExpanded[ep.id];
      var open = (stored===undefined) ? (idx===0) : stored;

      // 1) essenziale: cosa è successo in questa puntata, a colpo d'occhio
      var mysteryBox=[], esterna=[], cucina=[], miglior=[], nero=[], persaEsterna=[];
      var rowsHtml = "";
      state.concorrenti.forEach(function(c){
        var e = eventFor(ep.id, c.id);
        if (!e) return;
        if (e.mystery_box) mysteryBox.push(c.nome);
        if (e.vince_esterna) esterna.push(c.nome);
        if (e.vince_cucina) cucina.push(c.nome);
        if (e.miglior_piatto) miglior.push(c.nome);
        if (e.penalita==="nero") nero.push(c.nome);
        if (e.penalita==="esterna") persaEsterna.push(c.nome);
        var bp = basePoints(ep.id, c.id);
        var bonusStr = [e.mystery_box&&"Mystery Box", e.vince_esterna&&"Esterna", e.vince_cucina&&"Cucina", e.miglior_piatto&&"Miglior piatto"].filter(Boolean).join(", ") || "—";
        var penStr = e.penalita==="nero"?"Grembiule Nero":(e.penalita==="esterna"?"Persa Esterna":"—");
        rowsHtml += '<tr><td>'+esc(c.nome)+'</td><td>'+esc(bonusStr)+'</td><td>'+esc(penStr)+'</td><td class="num">'+fmtNum(bp.bonus+bp.penalty)+'</td></tr>';
      });
      html += '<div class="ep-card">'
        + '<div class="ep-card-head"><h3>Puntata '+ep.numero+(ep.confermata?'':' <span class="badge warn">Bozza</span>')+'</h3><span class="section-sub">'+esc(fmtEpWhen(ep))+'</span></div>';
      html += '<div class="ep-highlights">';
      if (cucina.length) html += '<span class="chip">🏆 Cucina: '+esc(cucina.join(", "))+'</span>';
      if (esterna.length) html += '<span class="chip">🌍 Esterna: '+esc(esterna.join(", "))+'</span>';
      if (mysteryBox.length) html += '<span class="chip">📦 Mystery Box: '+esc(mysteryBox.join(", "))+'</span>';
      if (miglior.length) html += '<span class="chip">🍽️ Miglior piatto: '+esc(miglior.join(", "))+'</span>';
      if (nero.length) html += '<span class="chip">⚫ Grembiule Nero: '+esc(nero.join(", "))+'</span>';
      if (persaEsterna.length) html += '<span class="chip">❌ Persa Esterna: '+esc(persaEsterna.join(", "))+'</span>';
      if (!rowsHtml) html += '<span class="muted">Nessun punteggio inserito ancora.</span>';
      html += '</div>';

      // 2) dettagli: punteggio completo, solo se richiesto
      if (rowsHtml){
        if (open){
          html += '<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>Concorrente</th><th>Bonus</th><th>Penalità</th><th class="num">Punti base</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
          html += '<span class="ep-toggle" data-ep-toggle="'+ep.id+'">Nascondi punteggi completi ‹</span>';
        } else {
          html += '<span class="ep-toggle" data-ep-toggle="'+ep.id+'">Vedi punteggi completi ›</span>';
        }
      }
      html += '</div>';
    });
    document.getElementById("panel-puntate").innerHTML = html;
    bindPuntateEvents();
  }
  function bindPuntateEvents(){
    document.querySelectorAll("[data-ep-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-ep-toggle");
        var currentlyOpen = el.textContent.indexOf("Nascondi")===0;
        state._puntateExpanded[id] = !currentlyOpen;
        renderPuntate();
      });
    });
  }

  /* ============ render: carte ============ */
  // La schermata Carte è organizzata come un vero tavolo da gioco: tre gruppi
  // sempre riconoscibili — Disponibili (puoi comprarla o usarla ora),
  // Utilizzate (storico personale), Non utilizzabili ora (motivo sempre visibile).
  // L'azione "Usa" apre un popup dedicato (cardDetailModalHtml) invece di un
  // modulo inline, così la carta resta il centro visivo della conferma.
  function renderCarte(){
    var team = state.myTeam;
    var remaining = team ? starsRemaining(team) : 0;
    var myPurchases = team ? state.purchases.filter(function(p){ return p.team_id===team.id; }) : [];

    if (!state._cardInfoOpen) state._cardInfoOpen = {};
    if (!state._carteGroupOpen) state._carteGroupOpen = {disponibili:true, utilizzate:false, bloccate:false};

    // 1) essenziale: quante Stelle ho
    var html = '<div class="screen-head"><img src="char-carte.png" alt="" class="screen-head-icon"><div><h2>Carte</h2><p class="section-sub">Tocca l\'immagine per vederla intera.</p></div></div>';
    if (team){
      html += '<div class="card stars-card"><img src="ico-stelle.png" alt=""><div><div class="stars-label">Stelle disponibili</div><div class="stars-val">'+remaining+' / '+(team.stelle_acquistate||1)+'</div></div></div>';
    }

    // 2) azione: una card per ogni tipo di carta, smistata in uno dei tre gruppi
    var buckets = {disponibili:[], utilizzate:[], bloccate:[]};
    state.cardTypes.forEach(function(c){
      var actionHtml = "";
      var bucket = "disponibili";
      if (team){
        var owned = myPurchases.some(function(p){ return p.card_key===c.key; });
        if (owned && c.key==="chef_ombra"){
          actionHtml = '<span class="badge ok">Posseduta</span>';
          bucket = "utilizzate";
        } else if (owned){
          var myAct = state.activations.filter(function(a){ return a.team_id===team.id && a.card_key===c.key; })[0];
          if (myAct){
            actionHtml = '<span class="badge ok">Utilizzata</span>' + activationSummary(myAct);
            bucket = "utilizzate";
          } else {
            var win = cardWindowInfo(c.key);
            if (win.open){
              actionHtml = '<button class="btn primary block" data-activate-card="'+esc(c.key)+'">Usa</button>';
              bucket = "disponibili";
            } else {
              actionHtml = '<button class="btn ghost block" disabled>Non ancora utilizzabile</button>'
                + '<p class="muted" style="font-size:12px;margin:6px 0 0;">'+esc(win.reasons.join(" · "))+'</p>';
              bucket = "bloccate";
            }
          }
        } else if (c.key==="chef_ombra" && state._pickingOmbra){
          var taken = teamChefsFor(team.id, true).map(function(tc){ return tc.concorrente_id; });
          var eligibili = state.concorrenti.filter(function(x){ return !x.eliminato && taken.indexOf(x.id)===-1; });
          actionHtml = eligibili.length
            ? ('<div style="display:flex;flex-direction:column;gap:8px;"><select id="ombra-select">' + eligibili.map(function(x){ return '<option value="'+x.id+'">'+esc(x.nome)+'</option>'; }).join("") + '</select>'
              + '<div><button class="btn sm primary" id="ombra-confirm">Conferma</button> '
              + '<button class="btn sm ghost" id="ombra-cancel">Annulla</button></div></div>')
            : '<span class="muted">Nessuno Chef disponibile</span>';
          bucket = "disponibili";
        } else {
          var afford = remaining >= Number(c.costo_stelle);
          actionHtml = '<button class="btn '+(afford?'primary':'ghost')+' block" data-buy-card="'+esc(c.key)+'" '+(afford?'':'disabled title="Stelle insufficienti"')+'>Compra</button>'
            + (afford ? '' : '<p class="muted" style="font-size:12px;margin:6px 0 0;">Stelle insufficienti per questo acquisto.</p>');
          bucket = afford ? "disponibili" : "bloccate";
        }
      }
      var infoOpen = !!state._cardInfoOpen[c.key];
      var stateClass = bucket==="utilizzate" ? " is-used" : (bucket==="bloccate" ? " is-blocked" : "");
      var itemHtml = '<div class="card-item'+stateClass+'">'
        + '<div class="card-item-head">'
        + '<img src="'+(CARD_IMG[c.key]||"")+'" alt="" class="card-item-thumb card-thumb" data-card-img="'+(CARD_IMG[c.key]||"")+'" data-card-label="'+esc(c.label)+'">'
        + '<div class="card-item-title"><h3>'+esc(c.label)+'</h3><span class="card-item-cost">'+c.costo_stelle+'★</span></div>'
        + '</div>'
        + '<span class="card-item-info" data-card-info-toggle="'+esc(c.key)+'">'+(infoOpen?'Nascondi spiegazione ‹':'Come funziona ›')+'</span>'
        + (infoOpen ? '<p class="card-item-desc">'+esc(c.descrizione)+(team?' Ogni carta si utilizza una sola volta; se non è disponibile, il motivo è indicato al posto del pulsante. La conferma è definitiva.':'')+'</p>' : '')
        + '<div class="card-item-status" style="margin-top:10px;">'+actionHtml+'</div>'
        + '</div>';
      buckets[bucket].push(itemHtml);
    });

    html += carteGroupHtml("disponibili", "Carte disponibili", buckets.disponibili, "Qui non c'è ancora niente da comprare o usare.");
    html += carteGroupHtml("utilizzate", "Carte utilizzate", buckets.utilizzate, "Non hai ancora usato nessuna carta.");
    html += carteGroupHtml("bloccate", "Non utilizzabili ora", buckets.bloccate, "Nessuna carta bloccata al momento.");

    // 3) dettagli secondari: storico, chiuso di default
    var storicoOpen = !!state._carteStoricoOpen;
    html += '<div class="disclosure'+(storicoOpen?' open':'')+'"><div class="disclosure-head" id="carte-toggle-storico"><h3>Storico attivazioni</h3><span class="disclosure-chevron">›</span></div>';
    if (storicoOpen){
      html += '<div class="disclosure-body">';
      if (!state.activationsPublic.length){
        html += '<p class="muted">Nessuna carta attivata finora.</p>';
      } else {
        state.activationsPublic.slice().reverse().forEach(function(a){
          var ep = byId(state.episodes, a.episode_id);
          var t = byId(state.teams, a.team_id);
          var ct = state.cardTypes.filter(function(c){return c.key===a.card_key;})[0];
          html += '<div class="disclosure-sub" style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;"><span>'+esc(ct?ct.label:a.card_key)+' — '+esc(t?displayName(t):"?")+'</span><span class="muted">Puntata '+(ep?ep.numero:"?")+'</span></div>';
        });
      }
      html += '</div>';
    }
    html += '</div>';

    html += cardDetailModalHtml();

    document.getElementById("panel-carte").innerHTML = html;
    bindCarteEvents();
  }
  function carteGroupHtml(key, title, items, emptyHint){
    var open = !!state._carteGroupOpen[key];
    var body = items.length ? items.join("") : ('<div class="carte-group-empty">'+esc(emptyHint)+'</div>');
    return '<div class="carte-group'+(open?' open':'')+'">'
      + '<div class="carte-group-head" data-carte-group-toggle="'+key+'"><h3>'+esc(title)+' <span class="carte-group-count">'+items.length+'</span></h3><span class="carte-group-chevron">›</span></div>'
      + (open ? '<div class="carte-group-body">'+body+'</div>' : '')
      + '</div>';
  }
  // Popup di dettaglio/utilizzo: appare sopra la schermata Carte senza farle
  // perdere il contesto (nessuna navigazione), con la carta come centro visivo.
  function cardDetailModalHtml(){
    var key = state._activatingCard;
    var open = !!key;
    var c = key ? state.cardTypes.filter(function(x){ return x.key===key; })[0] : null;
    var inner = "";
    if (c){
      inner = '<img class="card-detail-img" src="'+(CARD_IMG[c.key]||"")+'" alt="">'
        + '<h3>'+esc(c.label)+'</h3>'
        + '<span class="card-detail-cost">'+c.costo_stelle+'★ · si usa una sola volta, la conferma è definitiva</span>'
        + '<p class="card-detail-desc">'+esc(c.descrizione)+'</p>'
        + '<div class="card-detail-form">'+activationFormHtml(c)+'</div>';
    }
    return '<div id="card-detail-modal" class="'+(open?'open':'')+'">'
      + '<div class="card-detail-backdrop" data-modal-close></div>'
      + '<div class="card-detail-sheet parchment-panel">'
      + '<button type="button" class="card-detail-close" data-modal-close aria-label="Chiudi">✕</button>'
      + inner
      + '</div></div>';
  }

  function bindCarteEvents(){
    document.querySelectorAll("[data-card-info-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var key = el.getAttribute("data-card-info-toggle");
        if (!state._cardInfoOpen) state._cardInfoOpen = {};
        state._cardInfoOpen[key] = !state._cardInfoOpen[key];
        renderCarte();
      });
    });
    var storicoToggle = document.getElementById("carte-toggle-storico");
    if (storicoToggle){
      storicoToggle.addEventListener("click", function(){
        state._carteStoricoOpen = !state._carteStoricoOpen;
        renderCarte();
      });
    }
    document.querySelectorAll("[data-carte-group-toggle]").forEach(function(el){
      el.addEventListener("click", function(){
        var key = el.getAttribute("data-carte-group-toggle");
        if (!state._carteGroupOpen) state._carteGroupOpen = {};
        state._carteGroupOpen[key] = !state._carteGroupOpen[key];
        renderCarte();
      });
    });
    document.querySelectorAll("[data-modal-close]").forEach(function(el){
      el.addEventListener("click", function(){
        state._activatingCard = null;
        renderCarte();
      });
    });
    document.querySelectorAll("[data-buy-card]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-buy-card");
        if (key === "chef_ombra"){
          state._pickingOmbra = true;
          renderCarte();
          return;
        }
        var def = state.cardTypes.filter(function(c){ return c.key===key; })[0];

            payload = {team_id:team.id, card_key:key, episode_id:epEl2.value, target_team_id:null, target_concorrente_id:ownEl.value, scelta:"x2"};
          } else {

            if (!oppEl || !oppEl.value){ toast("Seleziona uno Chef avversario."); return; }

  /* ============ chat + avvisi ============ */
  var CHAT_EMOJIS = ["👍","❤️","😂","😮","😢","🎉"];
  function fmtDateTime(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var now = new Date();
    var time = d.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
    if (d.toDateString()===now.toDateString()) return time;
    return d.toLocaleDateString("it-IT", {day:"numeric", month:"short"}) + " " + time;
  }
  function chatProfileName(id){
    var p = state.profiles.filter(function(x){ return x.id===id; })[0];
    return p ? p.display_name : "Qualcuno";
  }
  function chatFindMsg(id){ return state.chatMessages.filter(function(m){ return m.id===id; })[0]; }
  function chatImageUrl(path){ return sb.storage.from("chat-media").getPublicUrl(path).data.publicUrl; }

  function renderChat(){
    var el = document.getElementById("panel-chat");
    updateChatBadge();
    if (!state.profile){ el.innerHTML = ""; return; }

    var reactionsByMsg = {};
    state.chatReactions.forEach(function(r){
      reactionsByMsg[r.message_id] = reactionsByMsg[r.message_id] || {};
      reactionsByMsg[r.message_id][r.emoji] = reactionsByMsg[r.message_id][r.emoji] || [];
      reactionsByMsg[r.message_id][r.emoji].push(r.profile_id);
    });

    var html = '<div class="chat-top"><img src="char-chat.png" alt=""><div class="chat-top-title"><h2>Chat</h2><span>Messaggi visibili 20 giorni</span></div>'
      + '<label class="chat-notif-toggle" title="Notifiche per gli avvisi importanti"><input type="checkbox" id="chat-notif-toggle" '+(state.profile.notifiche_attive?"checked":"")+'><span class="bell">🔔</span></label>'
      + '</div>';

    html += '<div id="chat-wrap"><div id="chat-list">';
    if (!state.chatMessages.length){
      html += '<div class="empty" style="text-align:center;">Nessun messaggio ancora. Scrivi il primo!</div>';
    }
    state.chatMessages.forEach(function(m){
      if (m.is_avviso){
        html += '<div class="chat-avviso">📣 '+esc(m.testo)+'<div class="chat-meta" style="margin:2px 0 0;">'+fmtDateTime(m.created_at)+'</div></div>';
        return;
      }
      var mine = m.author_id===state.profile.id;
      var replyMsg = m.reply_to_id ? chatFindMsg(m.reply_to_id) : null;
      html += '<div class="chat-msg'+(mine?" mine":"")+'" data-msg-id="'+m.id+'">';
      html += '<div class="chat-meta">'+esc(chatProfileName(m.author_id))+' · '+fmtDateTime(m.created_at)+'</div>';
      html += '<div class="chat-bubble">';
      if (replyMsg){
        var snippet = replyMsg.testo ? (replyMsg.testo.length>60 ? replyMsg.testo.slice(0,60)+"…" : replyMsg.testo) : "📷 foto";
        html += '<div class="chat-reply-preview">↩ '+esc(chatProfileName(replyMsg.author_id))+': '+esc(snippet)+'</div>';
      }
      if (m.testo){ html += '<div>'+esc(m.testo).replace(/\n/g,"<br>")+'</div>'; }
      if (m.image_path){
        var url = chatImageUrl(m.image_path);
        html += '<img class="chat-img" src="'+esc(url)+'" alt="">';
      }
      html += '</div>';
      var reacts = reactionsByMsg[m.id] || {};
      var reactKeys = Object.keys(reacts);
      if (reactKeys.length){
        html += '<div class="chat-reactions">';
        reactKeys.forEach(function(em){
          var who = reacts[em].map(chatProfileName).join(", ");
          var mineReacted = reacts[em].indexOf(state.profile.id)!==-1;
          html += '<button class="chat-react-btn'+(mineReacted?" mine":"")+'" data-toggle-react="'+m.id+'|'+em+'" title="'+esc(who)+'">'+em+' '+reacts[em].length+'</button>';
        });
        html += '</div>';
      }
      html += '<div class="chat-actions"><span data-reply-to="'+m.id+'">Rispondi</span><span data-open-react="'+m.id+'">Reagisci</span></div>';
      if (state._reactingMsg===m.id){
        html += '<div class="chat-emoji-row">' + CHAT_EMOJIS.map(function(em){ return '<button type="button" data-toggle-react="'+m.id+'|'+em+'">'+em+'</button>'; }).join("") + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    if (state._chatReplyTo){
      var rm = chatFindMsg(state._chatReplyTo);
      if (rm){
        var rsnippet = rm.testo ? (rm.testo.length>60 ? rm.testo.slice(0,60)+"…" : rm.testo) : "📷 foto";
        html += '<div id="chat-reply-bar"><span>↩ Rispondendo a '+esc(chatProfileName(rm.author_id))+': '+esc(rsnippet)+'</span><span style="cursor:pointer;" id="chat-reply-cancel">✕</span></div>';
      }
    }
    html += '<div id="chat-input-bar">'
      + '<input type="file" accept="image/*" id="chat-photo-input" class="hidden">'
      + '<button class="btn sm ghost" id="chat-photo-btn" type="button" title="Allega una foto"><img src="ico-fotocamera.png" alt="" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;"></button>'
      + '<textarea id="chat-text-input" placeholder="Scrivi un messaggio…" rows="1"></textarea>'
      + '<button class="btn sm primary" id="chat-send-btn" type="button">Invia</button>'
      + '</div>';
    html += '</div>';

    el.innerHTML = html;
    bindChatEvents();
    if (state._chatScrollPending){
      var list = document.getElementById("chat-list");
      if (list) list.scrollTop = list.scrollHeight;
      state._chatScrollPending = false;
    }
  }

  function bindChatEvents(){
    var notifToggle = document.getElementById("chat-notif-toggle");
    if (notifToggle){
      notifToggle.addEventListener("change", function(){
        var next = notifToggle.checked;
        sb.from("profiles").update({notifiche_attive: next}).eq("id", state.profile.id).then(function(res){
          if (res.error){ toast("Errore: " + res.error.message); notifToggle.checked = !next; return; }
          state.profile.notifiche_attive = next;
          toast(next ? "Notifiche attivate." : "Notifiche disattivate.");
        });
      });
    }
    document.querySelectorAll("[data-reply-to]").forEach(function(el){
      el.addEventListener("click", function(){
        state._chatReplyTo = el.getAttribute("data-reply-to");
        state._reactingMsg = null;
        renderChat();
        var input = document.getElementById("chat-text-input");
        if (input) input.focus();
      });
    });
    var replyCancel = document.getElementById("chat-reply-cancel");
    if (replyCancel){ replyCancel.addEventListener("click", function(){ state._chatReplyTo = null; renderChat(); }); }

    document.querySelectorAll("[data-open-react]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-open-react");
        state._reactingMsg = (state._reactingMsg===id) ? null : id;
        renderChat();
      });
    });
    document.querySelectorAll("[data-toggle-react]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var parts = btn.getAttribute("data-toggle-react").split("|");
        var msgId = parts[0], emoji = parts[1];
        var existing = state.chatReactions.filter(function(r){ return r.message_id===msgId && r.profile_id===state.profile.id && r.emoji===emoji; })[0];
        if (existing){
          sb.from("chat_reactions").delete().eq("id", existing.id).then(function(res){
            if (res.error){ toast("Errore: " + res.error.message); return; }
            loadChatData();
          });
        } else {
          sb.from("chat_reactions").insert({message_id: msgId, profile_id: state.profile.id, emoji: emoji}).then(function(res){
            if (res.error){ toast("Errore: " + res.error.message); return; }
            state._reactingMsg = null;
            loadChatData();
          });
        }
      });
    });

    var photoBtn = document.getElementById("chat-photo-btn");
    var photoInput = document.getElementById("chat-photo-input");
    if (photoBtn && photoInput){
      photoBtn.addEventListener("click", function(){ photoInput.click(); });
      photoInput.addEventListener("change", function(){
        var file = photoInput.files && photoInput.files[0];
        if (!file) return;
        if (file.size > 8*1024*1024){ toast("Foto troppo grande (massimo 8 MB)."); photoInput.value=""; return; }
        var path = state.profile.id + "/" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9_.-]/g,"_");
        toast("Caricamento foto…");
        sb.storage.from("chat-media").upload(path, file).then(function(res){
          if (res.error){ toast("Caricamento non riuscito: " + res.error.message); return; }
          sendChatMessage(null, path);
        });
        photoInput.value = "";
      });
    }

    var sendBtn = document.getElementById("chat-send-btn");
    var textInput = document.getElementById("chat-text-input");
    if (sendBtn && textInput){
      sendBtn.addEventListener("click", function(){
        var text = textInput.value.trim();
        if (!text) return;
        sendChatMessage(text, null);
      });
      textInput.addEventListener("keydown", function(e){
        if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendBtn.click(); }
      });
    }
  }

  function sendChatMessage(testo, imagePath){
    var payload = {
      author_id: state.profile.id,
      testo: testo || null,
      image_path: imagePath || null,
      reply_to_id: state._chatReplyTo || null,
      is_avviso: false
    };
    sb.from("chat_messages").insert(payload).then(function(res){
      if (res.error){ toast("Invio non riuscito: " + res.error.message); return; }
      state._chatReplyTo = null;
      var textInput = document.getElementById("chat-text-input");
      if (textInput) textInput.value = "";
      state._chatScrollPending = true;
      loadChatData();
    });
  }

  function loadChatData(){
    Promise.all([
      sb.from("chat_messages").select("*").order("created_at"),
      sb.from("chat_reactions").select("*")
    ]).then(function(res){
      if (res[0].error || res[1].error) return;
      state.chatMessages = res[0].data||[];
      state.chatReactions = res[1].data||[];
      if (state.activeTab==="chat"){ renderChat(); } else { updateChatBadge(); }
    });
  }
  function markChatRead(){
    if (!state.profile) return;
    var now = new Date().toISOString();
    state.chatLastRead = now;
    updateChatBadge();
    sb.from("chat_reads").upsert({profile_id: state.profile.id, last_read_at: now}).then(function(){});
  }
  function updateChatBadge(){
    var badge = document.getElementById("chat-badge");
    if (!badge || !state.profile) return;
    var lastRead = state.chatLastRead ? new Date(state.chatLastRead) : null;
    var count = state.chatMessages.filter(function(m){
      if (m.author_id===state.profile.id) return false;
      if (!lastRead) return true;
      return new Date(m.created_at) > lastRead;
    }).length;
    if (count>0 && state.activeTab!=="chat"){
      badge.textContent = count>99 ? "99+" : String(count);
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }

  // Dashboard Admin: anomalie calcolate al volo (non salvate), con priorità
  // urgente/importante/avviso come da regolamento. Nessuno storico: quando
  // la condizione che le genera sparisce, l'anomalia sparisce con lei.
  function computeAnomalie(){
    var items = [];
    var withoutTeam = state.profiles.filter(function(p){
      if (!p.attivo || p.is_admin) return false;
      return !state.teams.some(function(t){ return t.profile_id===p.id; });
    });
    if (withoutTeam.length){
      items.push({priority:"urgente", text: withoutTeam.length+" account attivi senza squadra collegata: "+withoutTeam.map(function(p){return p.display_name;}).join(", ")+".", anchor:"admin-sec-account"});
    }
    state.teams.forEach(function(t){
      var count = state.teamChefs.filter(function(tc){ return tc.team_id===t.id && tc.ruolo==="brigata" && tc.attivo; }).length;
      if (count>=3) return;
      var locked = brigataLocked(t);
      var dl = brigataDeadlineFor(t);
      if (locked){
        items.push({priority:"urgente", text: '"'+(t.nome_squadra||"Squadra")+'" ha la Brigata incompleta ('+count+'/3) ed è già bloccata.', anchor:"admin-sec-squadre"});
      } else if (dl){
        var daysLeft = Math.ceil((dl - new Date()) / 86400000);
        if (daysLeft<=3){
          items.push({priority:"importante", text: '"'+(t.nome_squadra||"Squadra")+'" ha la Brigata incompleta ('+count+'/3), scadenza tra '+(daysLeft<=0?"meno di un giorno":daysLeft+" giorni")+".", anchor:"admin-sec-squadre"});
        }
      }
    });
    state.episodes.filter(function(e){ return !e.confermata && e.data; }).forEach(function(e){
      var days = Math.floor((new Date() - new Date(e.data+"T00:00:00")) / 86400000);
      if (days>=2){
        items.push({priority:"importante", text: "Puntata "+e.numero+" è andata in onda ma non è ancora stata confermata.", anchor:"admin-sec-puntate"});
      }
    });
    var hasAnyDraft = state.episodes.some(function(e){ return !e.confermata; });
    var hasFutureDraft = state.episodes.some(function(e){ return !e.confermata && e.data; });
    if (hasAnyDraft && !hasFutureDraft){
      items.push({priority:"avviso", text: "C'è una puntata in bozza senza data: ricordati di impostarla.", anchor:"admin-sec-puntate"});
    }
    var order = {urgente:0, importante:1, avviso:2};
    items.sort(function(a,b){ return order[a.priority]-order[b.priority]; });
    return items;
  }
  function anomalieHtml(items){
    if (!items.length) return '<p class="section-sub">Nessun problema da segnalare.</p>';
    var labels = {urgente:"Urgente", importante:"Importante", avviso:"Avviso"};
    return items.map(function(it){
      return '<div class="banner '+(it.priority==="avviso"?"":"warn")+'"><span><span class="badge '+(it.priority==="avviso"?"ok":"warn")+'" style="margin-right:6px;">'+labels[it.priority]+'</span>'+esc(it.text)+'</span>'
        + '<button class="btn sm ghost" data-goto="'+esc(it.anchor)+'">Vai</button></div>';
    }).join("");
  }

    html += fieldset("Impostazioni lega", ''

    var nextNum = (state.episodes.reduce(function(m,e){return Math.max(m,e.numero);},0))+1;

      + '<div class="table-wrap"><table><thead><tr><th>Concorrente</th><th>Mystery</th><th>Esterna</th><th>Cucina</th><th>Piatto</th><th>Penalità</th></tr></thead><tbody>'+evRows+'</tbody></table></div>'

      + (editingEp?'<button class="btn sm ghost" id="a-cancel-ep">Annulla</button>':'')+'</div>',

    var epOpts = state.episodes.slice().sort(function(a,b){return b.numero-a.numero;}).map(function(e){return '<option value="'+e.id+'">Puntata '+e.numero+'</option>';}).join("");

      + '<label class="field"><span>Scelta (Secondo Intuito)</span><select id="a-act-choice"><option value="x2">Raddoppia</option><option value="dimezza">Dimezza</option></select></label>'
      + '</div><button class="btn sm" id="a-save-act">Registra attivazione</button>',
      "admin-sec-carte-attivazione"
    );

    var settingsKeys = [["bonus_mystery_box","Bonus Mystery Box"],["bonus_esterna","Bonus Esterna"],["bonus_cucina","Bonus Cucina"],["bonus_miglior_piatto","Bonus Miglior Piatto"],["penalita_nero","Penalità Nero"],["penalita_esterna","Penalità Esterna"],["costo_stella_eur","Costo Stella (€)"],["max_stelle","Stelle massime"]];
    html += fieldset("Regolamento & Parametri", '<div class="field-row">'
      + settingsKeys.map(function(k){ return '<label class="field"><span>'+esc(k[1])+'</span><input type="number" data-setting="'+k[0]+'" value="'+regola(k[0])+'"></label>'; }).join("")
      + '</div><button class="btn sm" id="a-save-settings">Salva parametri</button>',
      "admin-sec-parametri"
    );

    // Il regolamento non prevede notifiche manuali: questa sezione è solo di

    var avvisiRecenti = state.chatMessages.filter(function(m){ return m.is_avviso; })
      .slice().sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); }).slice(0,15);
    var attivi = state.profiles.filter(function(p){ return p.attivo; });
    var notifOff = attivi.filter(function(p){ return p.notifiche_attive===false; }).length;
    html += fieldset("Notifiche & Avvisi", ''
      + '<p class="section-sub" style="margin-top:-4px;">Gli avvisi sono automatici (nessun invio manuale, come da regolamento). '+notifOff+' giocatori su '+attivi.length+' hanno le notifiche disattivate.</p>'
      + (avvisiRecenti.length ? avvisiRecenti.map(function(m){
          return '<div class="banner"><span>'+esc(m.testo)+(m.target_profile_id?' <span class="badge ok">personale</span>':'')+'</span><span class="muted" style="font-size:12px;white-space:nowrap;">'+esc(fmtDateTime(m.created_at))+'</span></div>';
        }).join("") : '<p class="section-sub">Nessun avviso ancora.</p>'),
      "admin-sec-notifiche"
    );

    // Strumenti di correzione: la specifica non dettaglia il contenuto di
    // questa sezione oltre al nome, quindi qui copro il caso più concreto
    // già previsto dal regolamento ("l'Admin può correggere"): annullare
    // un'attivazione o un acquisto carta sbagliati.
    var actRows = state.activations.slice().sort(function(a,b){ return new Date(b.creato_il||0)-new Date(a.creato_il||0); }).map(function(a){
      var ep = byId(state.episodes, a.episode_id);
      var t = byId(state.teams, a.team_id);
      var ct = state.cardTypes.filter(function(c){return c.key===a.card_key;})[0];
      return '<div class="banner"><span>'+(ep?"Puntata "+ep.numero:"—")+' — '+esc(t?displayName(t):"?")+' — '+esc(ct?ct.label:a.card_key)+'</span><button class="btn sm ghost" data-remove-act="'+a.id+'" style="display:inline-flex;align-items:center;gap:5px;"><img src="ico-cestino.png" alt="" style="width:14px;height:14px;object-fit:contain;">Annulla</button></div>';
    }).join("") || '<p class="section-sub">Nessuna attivazione registrata.</p>';
    var purRows = state.purchases.slice().map(function(p){
      var t = byId(state.teams, p.team_id);
      var ct = state.cardTypes.filter(function(c){return c.key===p.card_key;})[0];
      var hasAct = state.activations.some(function(a){ return a.team_id===p.team_id && a.card_key===p.card_key; });
      return '<div class="banner"><span>'+esc(t?displayName(t):"?")+' — '+esc(ct?ct.label:p.card_key)+'</span>'
        + (hasAct ? '<span class="muted" style="font-size:12px;">Già attivata: annulla prima quella</span>' : '<button class="btn sm ghost" data-remove-purchase="'+p.id+'" style="display:inline-flex;align-items:center;gap:5px;"><img src="ico-cestino.png" alt="" style="width:14px;height:14px;object-fit:contain;">Annulla acquisto</button>')
        + '</div>';
    }).join("") || '<p class="section-sub">Nessun acquisto registrato.</p>';

      + '<h4 style="margin:0 0 6px;font-size:13.5px;color:var(--gold-strong);">Correggi attivazioni carte</h4>' + actRows
      + '<h4 style="margin:14px 0 6px;font-size:13.5px;color:var(--gold-strong);">Correggi acquisti carte</h4>' + purRows,
      "admin-sec-strumenti"
    );

    el.innerHTML = html;
    bindAdminEvents();

  function bindAdminEvents(){
    var g = function(id){ return document.getElementById(id); };
    document.querySelectorAll("[data-goto]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var target = g(btn.getAttribute("data-goto"));
        if (target){ target.open = true; target.scrollIntoView({behavior:"smooth", block:"start"}); }
      });
    });
    document.querySelectorAll("[data-remove-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!confirm("Annullare questa attivazione? La carta tornerà disponibile per l'uso.")) return;
        sb.from("card_activations").delete().eq("id", btn.getAttribute("data-remove-act")).then(afterWrite("Attivazione annullata."));
      });
    });
    document.querySelectorAll("[data-remove-purchase]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!confirm("Annullare questo acquisto carta?")) return;
        sb.from("card_purchases").delete().eq("id", btn.getAttribute("data-remove-purchase")).then(afterWrite("Acquisto annullato."));
      });
    });
    g("a-save-meta") && g("a-save-meta").addEventListener("click", function(){
      sb.from("league_meta").update({nome_lega:g("a-nome-lega").value.trim(), stagione_label:g("a-stagione").value.trim()}).eq("id", true).then(afterWrite("Impostazioni salvate."));
    });
    g("a-toggle-brigate") && g("a-toggle-brigate").addEventListener("click", function(){
      sb.from("league_meta").update({brigate_visibili: !state.meta.brigate_visibili}).eq("id", true).then(afterWrite("Fatto."));
    });
    g("a-toggle-ombra") && g("a-toggle-ombra").addEventListener("click", function(){
      if (!confirm("Confermi la rivelazione/nascondimento degli Chef Ombra?")) return;
      sb.from("league_meta").update({ombra_svelato: !state.meta.ombra_svelato}).eq("id", true).then(afterWrite("Fatto."));
    });
    g("a-new-pw-gen") && g("a-new-pw-gen").addEventListener("click", function(){ g("a-new-password").value = genPassword(); });
    g("a-create-player") && g("a-create-player").addEventListener("click", function(){
      var username = g("a-new-username").value.trim();
      var displayName = g("a-new-displayname").value.trim();
      var teamName = g("a-new-teamname").value.trim();
      var password = g("a-new-password").value;
      if (!username || !teamName || password.length<6){ toast("Username, nome squadra e password (almeno 6 caratteri) sono obbligatori."); return; }
      if (!confirm('Confermi la creazione dell\'account "'+username+'" e della squadra "'+teamName+'"?')) return;
      // Account e squadra vengono creati insieme in un'unica operazione atomica
      // lato server (Edge Function admin-manage-user): se la squadra non può
      // essere creata, l'account appena creato viene eliminato automaticamente,
      // cosi' non resta mai un profilo "orfano" senza squadra.
      callAdminManage({action:"create", username:username, display_name:displayName, password:password, team_name:teamName}).then(function(res){
        if (res.status!==200 || !res.body || !res.body.ok){
          toast("Creazione non riuscita: " + ((res.body&&res.body.error)||"errore sconosciuto"));
          return;
        }
        reload('Giocatore "'+username+'" creato.');
      }).catch(function(){ toast("Creazione non riuscita: errore di rete."); });
    });
    document.querySelectorAll("[data-reset-pw]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-reset-pw");
        var pw = prompt("Nuova password per questo account (almeno 6 caratteri). Puoi lasciare quella proposta oppure sceglierne un'altra:", genPassword());
        if (pw===null) return;
        if (pw.length<6){ toast("La password deve avere almeno 6 caratteri."); return; }
        if (!confirm("Confermi il reset della password? Comunicala tu stesso al giocatore.")) return;
        callAdminManage({action:"reset_password", target_user_id:id, password:pw}).then(function(res){
          if (res.status!==200 || !res.body || !res.body.ok){ toast("Reset non riuscito: " + ((res.body&&res.body.error)||"errore sconosciuto")); return; }
          toast("Password aggiornata.");
        });
      });
    });
    document.querySelectorAll("[data-toggle-active]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-toggle-active");
        var p = state.profiles.filter(function(x){ return x.id===id; })[0];
        if (!p) return;
        var next = !p.attivo;
        if (!confirm((next?"Riattivare":"Disattivare")+' l\'account di "'+p.display_name+'"?')) return;
        callAdminManage({action:"set_active", target_user_id:id, attivo:next}).then(function(res){
          if (res.status!==200 || !res.body || !res.body.ok){ toast("Operazione non riuscita: " + ((res.body&&res.body.error)||"errore sconosciuto")); return; }
          reload("Fatto.");
        });
      });
    });
    g("a-add-conc") && g("a-add-conc").addEventListener("click", function(){
      var name = g("a-new-conc").value.trim(); if (!name) return;
      sb.from("concorrenti").insert({nome:name}).then(afterWrite("Concorrente aggiunto."));
    });
    document.querySelectorAll("[data-toggle-elim]").forEach(function(b){
      b.addEventListener("click", function(){
        var c = byId(state.concorrenti, b.getAttribute("data-toggle-elim"));
        sb.from("concorrenti").update({eliminato: !c.eliminato}).eq("id", c.id).then(afterWrite("Fatto."));
      });
    });
    document.querySelectorAll("[data-player-name]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var val = inp.value.trim();
        if (!val){ toast("Il nome non può essere vuoto."); return; }
        sb.from("profiles").update({display_name:val}).eq("id", inp.getAttribute("data-player-name")).then(afterWrite("Salvato."));
      });
    });
    document.querySelectorAll("[data-team-name]").forEach(function(inp){
      inp.addEventListener("change", function(){ sb.from("teams").update({nome_squadra:inp.value.trim()}).eq("id", inp.getAttribute("data-team-name")).then(afterWrite("Salvato.")); });
    });
    document.querySelectorAll("[data-team-stars]").forEach(function(inp){
      inp.addEventListener("change", function(){ sb.from("teams").update({stelle_acquistate:Number(inp.value)||1}).eq("id", inp.getAttribute("data-team-stars")).then(afterWrite("Salvato.")); });
    });
    document.querySelectorAll("[data-team-entry]").forEach(function(inp){
      inp.addEventListener("change", function(){ sb.from("teams").update({punti_ingresso:Number(inp.value)||0}).eq("id", inp.getAttribute("data-team-entry")).then(afterWrite("Salvato.")); });
    });
    document.querySelectorAll("[data-save-team-brigata]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var teamId = btn.getAttribute("data-save-team-brigata");
        var block = btn.closest("[data-team-block]");
        var ids = Array.prototype.map.call(block.querySelectorAll("[data-team-brigata]"), function(sel){ return sel.value; });
        saveBrigata(teamId, ids, "Brigata salvata.");
      });
    });
    document.querySelectorAll("[data-team-scadenza-brigata]").forEach(function(inp){
      inp.addEventListener("change", function(){
        sb.from("teams").update({brigata_scadenza_personale: inp.value || null}).eq("id", inp.getAttribute("data-team-scadenza-brigata")).then(afterWrite("Salvato."));
      });
    });
    document.querySelectorAll("[data-save-team-sostituto]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var teamId = btn.getAttribute("data-save-team-sostituto");
        var sel = document.querySelector('[data-team-sostituto="'+teamId+'"]');
        var newId = sel ? sel.value : "";
        if (!newId){ toast("Scegli il nuovo Chef."); return; }
        if (!confirm("Registrare questa sostituzione di gennaio per questa squadra? È un'operazione una tantum: dopo non se ne potranno registrare altre, salvo usare \"Annulla sostituzione\".")) return;
        sb.from("team_chefs").insert({team_id:teamId, concorrente_id:newId, ruolo:"sostituto"}).then(function(res){
          if (res.error){ toast("Errore: " + res.error.message); return; }
          reload("Sostituzione registrata.");
        });
      });
    });
    document.querySelectorAll("[data-undo-sostituzione]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var teamId = btn.getAttribute("data-undo-sostituzione");
        var rowId = btn.getAttribute("data-sost-row");
        if (!confirm("Annullare la sostituzione di gennaio di questa squadra? Il giocatore potrà eventualmente rifarla da capo.")) return;
        // Operazione atomica lato database (RPC admin_undo_sostituzione): rimuove il
        // sostituto e resetta il flag "usata" in un'unica transazione, così un errore
        // a metà non lascia mai la squadra senza sostituto e bloccata per sempre.
        sb.rpc("admin_undo_sostituzione", {p_team_id: teamId, p_team_chefs_id: rowId}).then(afterWrite("Sostituzione annullata."));
      });
    });
    document.querySelectorAll("[data-ombra]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var teamId = sel.getAttribute("data-team");
        // Sostituzione atomica lato database (RPC admin_set_ombra): rimuove il vecchio
        // Chef Ombra e imposta il nuovo (o nessuno) in un'unica transazione, così un
        // errore a metà non lascia mai la squadra senza alcun Chef Ombra assegnato.
        sb.rpc("admin_set_ombra", {p_team_id: teamId, p_concorrente_id: sel.value || null}).then(afterWrite("Fatto."));
      });
    });
    document.querySelectorAll("[data-edit-ep]").forEach(function(b){ b.addEventListener("click", function(){
      state._editingEp = b.getAttribute("data-edit-ep");
      renderAdmin();
      var target = g("admin-sec-nuova-puntata");
      if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
    }); });
    g("a-cancel-ep") && g("a-cancel-ep").addEventListener("click", function(){ state._editingEp = null; renderAdmin(); });
    document.querySelectorAll("[data-confirm-ep]").forEach(function(b){
      b.addEventListener("click", function(){ sb.from("episodes").update({confermata:true}).eq("id", b.getAttribute("data-confirm-ep")).then(afterWrite("Puntata confermata.")); });
    });
    document.querySelectorAll("[data-unconfirm-ep]").forEach(function(b){
      b.addEventListener("click", function(){ sb.from("episodes").update({confermata:false}).eq("id", b.getAttribute("data-unconfirm-ep")).then(afterWrite("Riportata in bozza.")); });
    });
    g("a-save-ep") && g("a-save-ep").addEventListener("click", function(){
      var numero = parseInt(g("a-ep-num").value,10);
      var data = g("a-ep-data").value || null;
      var ora = g("a-ep-ora").value || null;
      if (!numero){ toast("Numero puntata mancante."); return; }
      var editing = state._editingEp ? byId(state.episodes, state._editingEp) : null;
      var events = state.concorrenti.filter(function(c){return !c.eliminato;}).map(function(c){
        return {
          concorrente_id: c.id,
          mystery_box: document.querySelector('[data-ev-mb="'+c.id+'"]').checked,
          vince_esterna: document.querySelector('[data-ev-est="'+c.id+'"]').checked,
          vince_cucina: document.querySelector('[data-ev-cuc="'+c.id+'"]').checked,
          miglior_piatto: document.querySelector('[data-ev-mp="'+c.id+'"]').checked,
          penalita: document.querySelector('[data-ev-pen="'+c.id+'"]').value || null
        };
      });
      // Salvataggio atomico lato database (RPC admin_save_episode): la puntata e
      // TUTTI gli eventi vengono scritti in un'unica transazione, così un errore a
      // metà non lascia mai data/ora aggiornate con eventi non salvati (o viceversa).
      sb.rpc("admin_save_episode", {
        p_episode_id: editing ? editing.id : null,
        p_numero: numero, p_data: data, p_ora: ora, p_events: events
      }).then(function(res){
        if (res.error){ toast("Errore: " + res.error.message); return; }
        state._editingEp = null;
        afterWrite("Puntata salvata.")(res);
      });
    });
    g("a-save-act") && g("a-save-act").addEventListener("click", function(){
      var payload = {
        episode_id: g("a-act-ep").value, card_key: g("a-act-card").value, team_id: g("a-act-team").value,
        target_team_id: g("a-act-target-team").value||null, target_concorrente_id: g("a-act-target-conc").value||null,
        scelta: g("a-act-card").value==="secondo_intuito" ? g("a-act-choice").value : null
      };
      sb.from("card_activations").insert(payload).then(afterWrite("Attivazione registrata."));
    });
    g("a-save-settings") && g("a-save-settings").addEventListener("click", function(){
      var rows = [];
      document.querySelectorAll("[data-setting]").forEach(function(inp){ rows.push({key:inp.getAttribute("data-setting"), value:Number(inp.value)}); });
      sb.from("settings").upsert(rows).then(afterWrite("Parametri salvati."));
    });
  }
  function afterWrite(msg){
    return function(res){
      if (res && res.error){ toast("Errore: " + res.error.message); return; }
      toast(msg);
      loadEverything();
    };
  }
  function reload(msg){ toast(msg); loadEverything(); }

  /* ============ admin: gestione account giocatori ============ */
  // Nessuna registrazione pubblica: gli account (username + password) sono
  // creati e resettati solo dall'Admin, tramite la funzione server-side
  // "admin-manage-user" (l'email interna di Supabase Auth non è mai
  // visibile qui: la gestisce solo la funzione, con la service-role key).
  function genPassword(){
    var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
    var out = "";
    for (var i=0;i<10;i++){ out += alphabet.charAt(Math.floor(Math.random()*alphabet.length)); }
    return out;
  }
  function callAdminManage(payload){
    return fetch(SUPABASE_URL + "/functions/v1/admin-manage-user", {
      method: "POST",
      headers: {"Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":"Bearer "+state.session.access_token},
      body: JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(body){ return {status:r.status, body:body}; });
    });
  }
  // Salva l'intera Brigata (fino a 3 Chef) come insieme coerente: calcola il
  // differenziale rispetto a quella attuale e rimuove prima, aggiunge dopo,
  // così il conteggio "massimo 3" lato database non scatta mai per errore
  // durante il salvataggio. Usata sia dal giocatore (Squadra) sia dall'Admin.
  // Il salvataggio della Brigata (rimuovi i vecchi Chef, aggiungi i nuovi) avviene
  // in un'UNICA chiamata atomica lato database (RPC replace_brigata): se una
  // qualunque regola non è rispettata (scadenza, max 3, Chef eliminato...) NON
  // viene tolto nessuno dei Chef attuali — niente più stati intermedi con la
  // Brigata a metà in caso di doppio click, rete lenta o errore a metà salvataggio.
  function saveBrigata(teamId, rawIds, doneMsg){
    var seen = {};
    var wanted = [];
    (rawIds||[]).forEach(function(id){
      if (!id || seen[id]) return;
      seen[id] = true;
      wanted.push(id);
    });
    var saveBtn = document.getElementById("sq-save-brigata");
    if (saveBtn){ if (saveBtn.disabled) return; saveBtn.disabled = true; }
    sb.rpc("replace_brigata", {p_team_id: teamId, p_concorrente_ids: wanted}).then(function(res){
      if (res.error){
        toast("Errore: " + res.error.message);
        if (saveBtn) saveBtn.disabled = false;
        return;
      }
      state._editingBrigata = false;
      afterWrite(doneMsg||"Fatto.")(res);
    });
  }

  document.addEventListener("click", function(ev){
    var t = ev.target.closest(".card-thumb");
    if (t){
      document.getElementById("card-lightbox-img").src = t.getAttribute("data-card-img");
      document.getElementById("card-lightbox-img").alt = t.getAttribute("data-card-label")||"";
      document.getElementById("card-lightbox").classList.add("open");
      return;
    }
    var ci = ev.target.closest(".chat-img");
    if (ci){
      document.getElementById("card-lightbox-img").src = ci.getAttribute("src");
      document.getElementById("card-lightbox-img").alt = "";
      document.getElementById("card-lightbox").classList.add("open");
      return;
    }
    if (ev.target.closest("#card-lightbox")){
      document.getElementById("card-lightbox").classList.remove("open");
    }
  });

  function renderAll(){
    renderHome(); renderClassifica(); renderSquadra(); renderConcorrenti(); renderPuntate(); renderCarte(); renderChat(); renderRegolamento(); renderAdmin();
    selectTab(state.activeTab);
  }

  /* ============ boot ============ */
  sb.auth.getSession().then(function(res){
    if (res.data.session){ onAuthed(); }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(err){
      console.warn('Service worker non registrato:', err);
    });
  });
}
</script>
