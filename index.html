<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanta MasterChef</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#151109">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantaMC">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#151109; --panel:#1d1811; --panel2:#241d13; --ink:#f3ead9; --ink-dim:#c9bda3; --ink-faint:#8d806a;
    --gold:#caa24c; --gold-strong:#e8c26a; --gold-dim:#8a6a2f; --olive:#5c6b3e; --teal:#3f8f82; --penalty:#c1543f; --line:#392f1f;
    --parchment:#f2e6c4; --parchment2:#e7d6a6; --ink-dark:#2b2013; --wood:#3a2413; --wood2:#5b3a22; --wood-dark:#241609;
    --green-accent:#4f7a3d; --green-accent-dark:#33511f;
  }
  *{box-sizing:border-box;}
  body{margin:0; color:var(--ink); font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1000px 520px at 12% -10%, rgba(122,80,30,.28) 0%, transparent 58%),
      radial-gradient(900px 520px at 105% 0%, rgba(90,55,18,.26) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0 0 8px;}
  a{color:var(--gold-strong);}
  button{font-family:inherit; cursor:pointer;}
  .hidden{display:none !important;}
  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(900px 600px at 20% -10%, #241708 0%, transparent 60%), radial-gradient(800px 600px at 100% 0%, #1e1409 0%, transparent 55%), var(--bg);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;}
  .auth-card{max-width:380px; width:100%; position:relative; border-top:2px solid var(--gold-dim);}
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12.5px; color:var(--ink-faint);}
  .field input, .field select, .field textarea{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:15px; font-family:inherit;}
  select{background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:15px; font-family:inherit; max-width:100%;}
  .field-row{display:flex; gap:10px; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:140px;}
  .field-row select, .field-row input{flex:1 1 120px; min-width:0; max-width:100%;}
  /* --- pulsanti: sistema unico, coerente con le carte (oro/legno), niente immagini --- */
  .btn{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700;
    box-shadow:0 2px 0 rgba(0,0,0,.3); transition:transform .05s ease, box-shadow .05s ease; letter-spacing:.01em;}
  .btn:active{transform:translateY(1px); box-shadow:0 0 0 rgba(0,0,0,0);}
  .btn.primary{background:linear-gradient(180deg,#f7e3a8 0%,#e8c26a 42%,#c99a3e 60%,#b9822a 100%); color:#3a2408; border:1px solid #7a5a1e;
    box-shadow:0 2px 0 #6b4d18, inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 8px rgba(122,90,30,.3);}
  .btn.primary:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
  .btn.block{width:100%; text-align:center;}
  .btn.sm{padding:6px 12px; font-size:13px;}
  .btn.danger{background:linear-gradient(180deg,#d97a63 0%,#b8503a 55%,#8a3222 100%); color:#fff3ec; border:1px solid #5e1f13;
    box-shadow:0 2px 0 #4a180e, inset 0 1px 0 rgba(255,255,255,.25);}
  .btn.danger:active{box-shadow:inset 0 1px 0 rgba(0,0,0,.15);}
  .btn.ghost{background:transparent; box-shadow:none; border-color:var(--line);}
  .btn:disabled{opacity:.42; cursor:not-allowed; box-shadow:none; transform:none;}
  /* --- illustrazioni e cornici "carta da gioco" --- */
  .hero-illus{width:100%; max-width:280px; display:block; margin:0 auto 14px; border-radius:12px; border:2px solid var(--gold); box-shadow:0 6px 18px rgba(0,0,0,.4); background:var(--wood-dark);}
  .hero-illus.sm{max-width:170px;}
  .empty img.hero-illus, .card.empty img.hero-illus{margin-bottom:10px;}
  .section-head h2{position:relative; display:inline-block;}
  .section-head h2::after{content:""; display:block; width:38px; height:3px; background:var(--gold); border-radius:3px; margin-top:5px;}
  .tabs-link{text-align:center; margin-top:12px; font-size:13.5px; color:var(--ink-faint);}
  .tabs-link span{color:var(--gold-strong); cursor:pointer; text-decoration:underline;}
  #app{max-width:900px; margin:0 auto; padding-bottom:90px;}
  header.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);}
  header.topbar h1{font-size:20px;}
  .eyebrow{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
  main{padding:16px;}
  .section-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px;}
  .section-sub{color:var(--ink-faint); font-size:13px; margin:0;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  /* Classifica: ogni squadra è una "targhetta" a sé, come le carte in Carte —
     non una tabella gestionale. Il primo posto e la propria squadra si
     riconoscono a colpo d'occhio; dal 4° posto in poi lo stile resta sobrio
     per restare leggibile anche con molti giocatori in lega. */
  .classifica-row-card{background:var(--panel); border:1px solid var(--line); border-radius:13px; margin-bottom:9px; overflow:hidden;}
  .classifica-row-card.mine{border-color:var(--gold);}
  .classifica-row-card.pos-1{border-color:var(--gold); background:linear-gradient(160deg, rgba(232,194,106,.14) 0%, var(--panel) 68%); box-shadow:0 4px 16px rgba(202,162,76,.18);}
  .classifica-row-card.pos-2, .classifica-row-card.pos-3{border-top:2px solid var(--gold-dim);}
  .classifica-row-head{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .classifica-num{width:32px; text-align:center; flex:0 0 auto;}
  .classifica-num .medal{font-size:21px; line-height:1;}
  .classifica-row-card.pos-1 .classifica-num .medal{font-size:26px;}
  .classifica-num .plain{font-family:'Fraunces',serif; font-weight:700; color:var(--gold-strong); font-size:16px;}
  .classifica-name{flex:1; min-width:0;}
  .classifica-name .team-name{font-weight:600; font-size:14.5px;}
  .classifica-mine-tag{display:inline-block; margin-left:6px; font-size:10px; font-weight:700; color:var(--gold-strong); background:rgba(202,162,76,.16); border:1px solid var(--gold-dim); border-radius:999px; padding:1px 7px; vertical-align:middle;}
  .classifica-sub-row{margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .classifica-lead-tag{font-size:11px; font-weight:700; color:var(--gold-strong); letter-spacing:.01em;}
  .classifica-delta-pill{display:inline-flex; align-items:center; gap:2px; font-size:11px; font-weight:700; border-radius:999px; padding:1px 7px;}
  .classifica-delta-pill.up{color:var(--teal); background:rgba(63,143,130,.16);}
  .classifica-delta-pill.down{color:var(--penalty); background:rgba(193,84,63,.16);}
  .classifica-points{text-align:right; flex:0 0 auto;}
  .classifica-points b{font-family:'Fraunces',serif; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);}
  .classifica-row-card.pos-1 .classifica-points b{color:var(--gold-strong);}
  .classifica-points-sub{display:block; font-size:10px; color:var(--ink-faint);}
  .classifica-chevron{color:var(--gold-strong); font-size:15px; flex:0 0 auto; transition:transform .2s ease;}
  .classifica-row-card.open .classifica-chevron{transform:rotate(90deg);}
  .classifica-row-body{padding:0 14px 16px; border-top:1px solid var(--line); padding-top:14px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-faint); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .table-wrap{overflow-x:auto;}
  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12.5px; margin:2px 4px 2px 0;}
  .chip.ombra{border-color:var(--gold);}
  .badge{font-size:11px; padding:2px 7px; border-radius:999px; font-weight:600;}
  .badge.ok{background:rgba(63,143,130,.2); color:var(--teal);}
  .badge.warn{background:rgba(193,84,63,.2); color:var(--penalty);}
  fieldset{border:1px solid var(--line); border-radius:12px; margin:0 0 16px; padding:14px;}
  legend{padding:0 8px; font-weight:600; color:var(--gold-strong); font-size:13.5px;}
  .bottombar{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; padding-bottom:env(safe-area-inset-bottom,0px); border-top:3px solid var(--gold-dim);
    box-shadow:0 -6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 18px, rgba(0,0,0,.07) 20px),
      linear-gradient(180deg,#2a1c0e,#150f08);}
  .bottombar button{flex:1; background:none; border:none; color:var(--ink-faint); font-size:11px; padding:8px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bottombar button.active{color:var(--gold-strong); text-shadow:0 0 8px rgba(232,194,106,.45);}
  .bottombar button .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .bottombar button .nav-ico{width:21px; height:21px; object-fit:contain; opacity:.72;}
  .bottombar button.active .nav-ico{opacity:1; filter:drop-shadow(0 0 3px rgba(232,194,106,.5));}
  .nav-dots{display:flex; gap:3px; align-items:center; height:21px;}
  .nav-dots span{width:4px; height:4px; border-radius:50%; background:currentColor; opacity:.72;}
  .more-panel{position:absolute; bottom:100%; right:6px; margin-bottom:8px; background:var(--parchment); color:var(--ink-dark); border:1px solid #a98a4a; border-radius:12px; box-shadow:0 -8px 24px rgba(0,0,0,.5); padding:6px; display:flex; flex-direction:column; min-width:180px;}
  .more-panel button{flex:none; flex-direction:row; justify-content:flex-start; gap:10px; padding:11px 12px; font-size:13.5px; border-radius:8px; color:var(--ink-dark); font-weight:600;}
  .more-panel button .nav-ico{width:20px; height:20px; object-fit:contain;}
  .more-panel button:active{background:rgba(122,90,30,.15);}
  .empty{padding:30px 16px; text-align:center; color:var(--ink-faint);}
  #toast-root{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px;}
  .toast{background:#2a2313; border:1px solid var(--gold); color:var(--ink); padding:10px 16px; border-radius:9px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.4);}
  #loading-overlay{position:fixed; inset:0; z-index:150; background:var(--wood-dark); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  #loading-overlay img{width:120px; height:120px; object-fit:contain; animation:loading-spin 1.6s linear infinite;}
  #loading-overlay span{color:var(--gold-strong); font-family:'Fraunces',serif; font-size:15px; letter-spacing:.02em;}
  @keyframes loading-spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  .banner{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .banner.warn{border-color:var(--penalty);}
  .banner.ok{border-color:var(--teal);}
  .err{color:var(--penalty); font-size:13px; margin-top:6px;}
  .muted{color:var(--ink-faint);}
  /* --- home/brigata: gerarchia essenziale → azione → dettagli --- */
  .greet-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .greet-illus{width:52px; height:52px; object-fit:cover; border-radius:50%; border:2px solid var(--gold); flex:0 0 auto; background:var(--wood-dark);}
  .greet-row h1{font-size:19px; margin:0;}
  .notice{background:linear-gradient(160deg, var(--parchment) 0%, var(--parchment2) 100%); color:var(--ink-dark); border:1px solid #b99a5c; border-radius:12px; padding:12px 14px; margin-bottom:16px; box-shadow:0 5px 14px rgba(0,0,0,.3); position:relative;}
  .notice-head{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:#7a4a1e; margin-bottom:2px;}
  .notice-icon{width:20px; height:20px; object-fit:cover; border-radius:50%; flex:0 0 auto;}
  .notice-item{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0 6px 28px; border-top:1px solid #cdb27e;}
  .notice-when{color:#8a7550; white-space:nowrap; font-size:12px;}
  .my-team-card{display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:20px; cursor:pointer; -webkit-tap-highlight-color:transparent; border-left:4px solid var(--gold); background:linear-gradient(100deg, rgba(202,162,76,.12), var(--panel) 55%);}
  .my-team-card:active{background:var(--panel2);}
  .my-team-pos{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--gold-strong); width:38px; text-align:center; flex:0 0 auto;}
  .my-team-info{flex:1; min-width:0;}
  .my-team-label{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
  .my-team-name{font-family:'Fraunces',serif; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .my-team-points{text-align:right; flex:0 0 auto;}
  .my-team-points b{font-family:'Fraunces',serif; font-size:19px; display:block;}
  .my-team-points-sub{font-size:11px; color:var(--ink-faint);}
  .my-team-chevron{font-size:20px; color:var(--ink-faint); flex:0 0 auto;}
  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;}
  .action-card{background:linear-gradient(160deg, var(--panel) 0%, var(--panel2) 100%); border:1px solid var(--line); border-top:2px solid var(--gold-dim); border-radius:14px; padding:14px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; cursor:pointer; -webkit-tap-highlight-color:transparent; position:relative; box-shadow:0 4px 10px rgba(0,0,0,.25);}
  .action-card::after{content:""; position:absolute; top:7px; right:9px; width:5px; height:5px; border-radius:50%; background:var(--gold-dim); box-shadow:0 1px 1px rgba(0,0,0,.5);}
  .action-card:active{background:var(--panel2); border-color:var(--gold-dim);}
  .action-icon-wrap{width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #6a4527, var(--wood-dark) 72%); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);}
  .action-icon-wrap img{width:21px; height:21px; object-fit:contain;}
  .action-card h3{margin:0; font-size:14.5px;}
  .action-card span{font-size:11.5px; color:var(--ink-faint); line-height:1.3;}
  .stat-row{display:flex; margin-bottom:18px; border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .stat-cell{flex:1; padding:12px 8px; text-align:center; border-right:1px solid var(--line);}
  .stat-cell:last-child{border-right:none;}
  .stat-cell .section-sub{margin-bottom:2px; font-size:11.5px;}
  .stat-cell .stat-val{font-family:'Fraunces',serif; font-size:21px; display:flex; align-items:center; justify-content:center; gap:5px;}
  .disclosure{background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; overflow:hidden;}
  .disclosure-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 18px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .disclosure-head h3{margin:0; font-size:14.5px;}
  .disclosure-chevron{font-size:15px; color:var(--gold-strong); transition:transform .2s ease; flex:0 0 auto;}
  .disclosure.open .disclosure-chevron{transform:rotate(90deg);}
  .disclosure-body{padding:2px 18px 18px;}
  .disclosure-sub{padding-top:14px; margin-top:14px; border-top:1px solid var(--line);}
  .disclosure-sub:first-child{padding-top:0; margin-top:0; border-top:none;}
  .brigata-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .brigata-head img{width:44px; height:44px; object-fit:cover; border-radius:50%; border:2px solid var(--gold); flex:0 0 auto;}
  .brigata-head h3{margin:0; font-size:15px;}
  .brigata-chips{display:flex; flex-wrap:wrap; gap:6px 8px; margin-bottom:4px;}
  .brigata-chips .chip{margin:0; padding:6px 12px; font-size:13px;}
  .status-line{display:flex; align-items:flex-start; gap:7px; font-size:12.5px; color:var(--ink-faint); margin:10px 0 0;}
  .status-line img{width:14px; height:14px; object-fit:contain; flex:0 0 auto; margin-top:2px;}
  header.topbar .btn.sm{padding:11px 14px; min-height:44px;}

  /* --- sistema grafico globale: legno / pergamena / oro --- */
  .signboard{
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 20px, rgba(0,0,0,.06) 22px),
      linear-gradient(180deg, #6a4527 0%, #4a2c17 60%, #3a2110 100%);
    border:2px solid var(--gold-dim); border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); position:relative;
  }
  .signboard::before{content:""; position:absolute; inset:5px; border:1px solid rgba(232,194,106,.3); border-radius:11px; pointer-events:none;}
  .parchment-panel{background:linear-gradient(160deg, var(--parchment) 0%, var(--parchment2) 100%); color:var(--ink-dark);
    border:1px solid #b99a5c; border-radius:14px; box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .home-hero{display:flex; align-items:stretch; margin-bottom:18px; overflow:hidden; padding:0;}
  .home-hero-img{width:100px; align-self:stretch; object-fit:cover; object-position:top center; flex:0 0 auto;
    border-radius:13px 0 0 13px; border-right:2px solid var(--gold-dim); box-shadow:inset -10px 0 16px -12px rgba(0,0,0,.7); background:var(--wood-dark);}
  .home-hero-text{flex:1; min-width:0; padding:14px 16px; display:flex; flex-direction:column; justify-content:center;}
  .home-hero-text h1{font-size:19px; margin:0 0 3px; color:var(--gold-strong); text-shadow:0 2px 4px rgba(0,0,0,.4);}
  .home-hero-tag{margin:0; font-size:12px; color:var(--ink-dim);}

  /* --- breakpoint mobile: telefoni molto stretti (≤389px, es. iPhone SE/mini) --- */
  @media (max-width: 389px){
    main{padding:14px;}
    .greet-row{gap:9px; margin-bottom:13px;}
    .greet-illus{width:42px; height:42px;}
    .greet-row h1{font-size:16.5px;}
    .notice{padding:9px 11px; margin-bottom:13px;}
    .notice-head{font-size:13px;}
    .notice-item{font-size:12.5px; padding:5px 0 5px 26px;}
    .my-team-card{padding:11px 13px; gap:10px; margin-bottom:15px;}
    .my-team-pos{font-size:19px; width:32px;}
    .my-team-name{font-size:15px;}
    .my-team-points b{font-size:17px;}
    .stat-row{margin-bottom:13px;}
    .stat-cell{padding:9px 5px;}
    .stat-cell .stat-val{font-size:18px;}
    .disclosure{margin-bottom:13px;}
    .disclosure-head{padding:13px 14px;}
    .disclosure-body{padding:2px 14px 14px;}
    .brigata-head img{width:38px; height:38px;}
    .brigata-head h3{font-size:14px;}
    .brigata-chips .chip{padding:5px 10px; font-size:12px;}
    .classifica-row-head{padding:11px 10px; gap:9px;}
    .classifica-row-body{padding-left:10px; padding-right:10px;}
    .action-grid{gap:9px; margin-bottom:15px;}
    .action-card{padding:11px;}
    .action-icon-wrap{width:36px; height:36px;}
    .action-icon-wrap img{width:18px; height:18px;}
    .home-hero{margin-bottom:13px;}
    .home-hero-img{width:78px;}
    .home-hero-text{padding:10px 12px;}
    .home-hero-text h1{font-size:16.5px;}

<script>
/* ============ banner "aggiungi alla schermata Home" ============ */
(function(){
  "use strict";
  function isStandalone(){
    return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  if (isStandalone()) return;
  if (sessionStorage.getItem('installBannerDismissed')) return;

  var ua = navigator.userAgent.toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua);
  var isAndroid = /android/.test(ua);
  var deferredPrompt = null;
  var shown = false;

  function showBanner(msg, onInstallClick){
    if (shown) return;
    shown = true;
    var b = document.createElement('div');
    b.id = 'install-banner';
    b.innerHTML = '<div class="install-banner-inner"><span>'+msg+'</span>'
      + (onInstallClick ? '<button class="btn sm primary" id="install-btn">Installa</button>' : '')
      + '<button class="btn sm ghost" id="install-dismiss">Chiudi</button></div>';
    document.body.appendChild(b);
    document.getElementById('install-dismiss').addEventListener('click', function(){
      b.remove();
      sessionStorage.setItem('installBannerDismissed','1');
    });
    if (onInstallClick){
      document.getElementById('install-btn').addEventListener('click', onInstallClick);
    }
  }

  if (isIOS){
    showBanner('📲 Per trovarlo sempre: tocca <b>Condividi</b> (il quadrato con la freccia in su) e poi <b>"Aggiungi alla schermata Home"</b>.');
  } else {
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredPrompt = e;
      showBanner('📲 Aggiungi Fanta MasterChef alla schermata Home per trovarlo sempre.', function(){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function(){
          var el = document.getElementById('install-banner');
          if (el) el.remove();
        });
      });
    });
    if (isAndroid){
      setTimeout(function(){
        if (!shown){
          showBanner('📲 Per trovarlo sempre: apri il menu ⋮ del browser e scegli <b>"Aggiungi a schermata Home"</b>.');
        }
      }, 2500);
    }
  }
})();

(function(){
  "use strict";
  var SUPABASE_URL = "https://czedbjydrcvgpcbaixvw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_KXELHdX5WcVzk10YMH1xYw_o4jbwbtY";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var CARD_ICON = {chef_ombra:"🥷", fornelli_spenti:"🔥", secondo_intuito:"🔮", salvataggio:"🛟", variazione_artusi:"🥸"};
  var CARD_IMG = {chef_ombra:"card-chef-ombra.png", fornelli_spenti:"card-fornelli-spenti.png", secondo_intuito:"card-secondo-intuito.png", salvataggio:"card-salvataggio.png", variazione_artusi:"card-variazione-artusi.png"};

  /* ============ state ============ */
  var state = {
    session: null, profile: null, myTeam: null, profiles: [],

  function toast(msg){
    var root = document.getElementById("toast-root");

    t.className = "toast"; t.textContent = msg;
    root.appendChild(t);
    setTimeout(function(){ t.remove(); }, 4000);

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function byId(list, id){ for (var i=0;i<list.length;i++){ if (list[i].id===id) return list[i]; } return null; }
  function fmtDate(iso){
    if (!iso) return "";
    var d = new Date(iso.length<=10 ? iso+"T00:00:00" : iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("it-IT", {day:"numeric", month:"long", year:"numeric"});
  }
  function fmtNum(n){
    n = Number(n)||0;
    var s = (Math.round(n*2)/2).toString();
    return (n>0?"+":"") + s;
  }
  // Grafico a linea disegnato a mano in SVG inline: nessuna libreria esterna,
  // così funziona anche offline (coerente con l'impostazione PWA dell'app).
  function svgLineChart(points, opts){
    opts = opts || {};
    var w = opts.width || 280, h = opts.height || 70, pad = 6;
    if (!points || points.length < 2){
      return '<div class="muted" style="font-size:11px;white-space:nowrap;">'+(opts.fallback||"Dati insufficienti.")+'</div>';
    }
    var ys = points.map(function(p){ return p.y; });
    var minY = Math.min(0, Math.min.apply(null, ys));
    var maxY = Math.max(0, Math.max.apply(null, ys));
    if (maxY === minY){ maxY = minY + 1; }
    var stepX = (w - 2*pad) / (points.length - 1);
    function px(i){ return pad + i*stepX; }
    function py(v){ return h - pad - ((v - minY) / (maxY - minY)) * (h - 2*pad); }
    var path = points.map(function(p, i){ return (i===0 ? "M" : "L") + px(i).toFixed(1) + "," + py(p.y).toFixed(1); }).join(" ");
    var dots = points.map(function(p, i){ return '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="2.5" style="fill:'+(opts.color||"var(--gold-strong)")+';"></circle>'; }).join("");
    var zeroLine = (minY < 0 && maxY > 0)
      ? '<line x1="'+pad+'" y1="'+py(0).toFixed(1)+'" x2="'+(w-pad)+'" y2="'+py(0).toFixed(1)+'" style="stroke:var(--line);stroke-width:1;"></line>'
      : "";
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block;overflow:visible;">'
      + zeroLine
      + '<path d="'+path+'" fill="none" style="stroke:'+(opts.color||"var(--gold-strong)")+';stroke-width:2;"></path>'
      + (opts.dots===false ? "" : dots)
      + '</svg>';
  }
  // Grafico dell'andamento della POSIZIONE in classifica puntata dopo
  // puntata (diverso dal grafico del punteggio cumulativo sopra). L'asse è
  // invertito apposta: la posizione 1 (la migliore) va disegnata in alto.
  function svgPositionChart(series, teamCount, opts){
    opts = opts || {};
    var w = opts.width || 280, h = opts.height || 70, pad = 10;
    if (!series || series.length < 2){
      return '<div class="muted" style="font-size:11px;white-space:nowrap;">Dati insufficienti.</div>';
    }
    var maxPos = Math.max(teamCount||1, Math.max.apply(null, series.map(function(s){ return s.pos; })));
    var stepX = (w - 2*pad) / (series.length - 1);
    function px(i){ return pad + i*stepX; }
    function py(pos){ return pad + ((pos-1) / Math.max(1, maxPos-1)) * (h - 2*pad); }
    var path = series.map(function(s, i){ return (i===0 ? "M" : "L") + px(i).toFixed(1) + "," + py(s.pos).toFixed(1); }).join(" ");
    var dots = series.map(function(s, i){
      return '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(s.pos).toFixed(1)+'" r="2.5" style="fill:var(--teal);"><title>Puntata '+s.numero+': #'+s.pos+'</title></circle>';
    }).join("");
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block;overflow:visible;">'
      + '<path d="'+path+'" fill="none" style="stroke:var(--teal);stroke-width:2;"></path>'
      + dots
      + '</svg>';
  }


  /* ============ auth ============ */
  // Login by USERNAME: the browser never sees or handles the internal auth
  // email. It calls the login-username Edge Function, which resolves the
  // username server-side and verifies the password through Supabase Auth,
  // returning only a session token pair. Public self-registration has been
  // removed: accounts are created only by the Admin.
  document.getElementById("login-btn").addEventListener("click", function(){
    var username = document.getElementById("login-username").value.trim();
    var password = document.getElementById("login-password").value;
    var errEl = document.getElementById("login-error");
    var illusEl = document.getElementById("auth-illus");
    errEl.classList.add("hidden");
    if (illusEl) illusEl.src = "char-login.png";
    if (!username || !password){
      errEl.textContent = "Inserisci username e password.";
      errEl.classList.remove("hidden");
      if (illusEl) illusEl.src = "char-errore.png";
      return;
    }
    var btn = document.getElementById("login-btn");
    btn.disabled = true;
    fetch(SUPABASE_URL + "/functions/v1/login-username", {
      method: "POST",
      headers: {"Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY},
      body: JSON.stringify({username:username, password:password})
    }).then(function(r){
      return r.json().then(function(body){ return {status:r.status, body:body}; });
    }).then(function(res){
      btn.disabled = false;
      if (!res.body || !res.body.session){
        errEl.textContent = (res.body && res.body.error) || "Credenziali non valide.";
        errEl.classList.remove("hidden");
        if (illusEl) illusEl.src = "char-errore.png";
        return;
      }
      sb.auth.setSession({access_token: res.body.session.access_token, refresh_token: res.body.session.refresh_token}).then(function(){
        onAuthed();
      });
    }).catch(function(){
      btn.disabled = false;
      errEl.textContent = "Credenziali non valide.";
      errEl.classList.remove("hidden");
      if (illusEl) illusEl.src = "char-errore.png";
    });
  });

  document.getElementById("logout-btn").addEventListener("click", function(){
    sb.auth.signOut().then(function(){ location.reload(); });
  });

  function onAuthed(){
    sb.auth.getSession().then(function(res){
      state.session = res.data.session;
      if (!state.session){ return; }
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      document.getElementById("bottombar").classList.remove("hidden");
      var loadingEl = document.getElementById("loading-overlay");
      if (loadingEl) loadingEl.classList.remove("hidden");
      loadEverything();
    });
  }

  /* ============ data loading ============ */
  function loadEverything(){
    var uid = state.session.user.id;
    Promise.all([
      sb.from("profiles").select("*").eq("id", uid).single(),
      sb.from("league_meta").select("*").single(),
      sb.from("settings").select("*"),
      sb.from("concorrenti").select("*").order("nome"),
      sb.from("teams").select("*, profiles(display_name, username)"),
      sb.from("team_chefs").select("*"),
      sb.from("episodes").select("*").order("numero"),
      sb.from("episode_events").select("*"),
      sb.from("card_types").select("*"),
      sb.from("card_purchases").select("*"),
      sb.from("card_activations").select("*"),
      sb.from("card_activations_public").select("*"),
      sb.from("profiles").select("*"),
      sb.from("chat_messages").select("*").order("created_at"),
      sb.from("chat_reactions").select("*"),
      sb.from("chat_reads").select("*").eq("profile_id", uid).maybeSingle()
    ]).then(function(res){
      var errs = res.filter(function(r){ return r.error; });
      if (errs.length){ console.error(errs); toast("Errore nel caricamento dati: " + errs[0].error.message); }
      state.profile = res[0].data;
      state.meta = res[1].data;
      (res[2].data||[]).forEach(function(s){ state.settings[s.key] = Number(s.value); });
      state.concorrenti = res[3].data||[];
      state.teams = res[4].data||[];
      state.teamChefs = res[5].data||[];
      state.episodes = res[6].data||[];
      state.events = res[7].data||[];
      state.cardTypes = res[8].data||[];
      state.purchases = res[9].data||[];
      state.activations = res[10].data||[];
      state.activationsPublic = res[11].data||[];
      state.profiles = res[12].data||[];
      state.chatMessages = res[13].data||[];
      state.chatReactions = res[14].data||[];
      state.chatLastRead = (res[15].data && res[15].data.last_read_at) || null;
      state.myTeam = state.teams.filter(function(t){ return t.profile_id===uid; })[0] || null;
      document.getElementById("league-name-display").textContent = state.meta.nome_lega;
      document.getElementById("season-label-display").textContent = "Stagione " + state.meta.stagione_label;
      document.getElementById("admin-nav-btn").style.display = state.profile.is_admin ? "" : "none";
      sb.rpc("purge_old_chat").then(function(){}, function(){});
      renderAll();
      var loadingEl = document.getElementById("loading-overlay");
      if (loadingEl) loadingEl.classList.add("hidden");
    });
  }

  function regola(key, fallback){ return state.settings[key]!=null ? state.settings[key] : (fallback||0); }

  /* ============ scoring engine ============ */
  function eventFor(episodeId, concorrenteId){
    for (var i=0;i<state.events.length;i++){ var e=state.events[i]; if (e.episode_id===episodeId && e.concorrente_id===concorrenteId) return e; }
    return null;
  }
  function basePoints(episodeId, concorrenteId){
    var e = eventFor(episodeId, concorrenteId);
    if (!e) return {bonus:0, penalty:0};
    var bonus = 0;
    if (e.mystery_box) bonus += regola("bonus_mystery_box",3);
    if (e.vince_esterna) bonus += regola("bonus_esterna",4);
    if (e.vince_cucina) bonus += regola("bonus_cucina",4);
    if (e.miglior_piatto) bonus += regola("bonus_miglior_piatto",2);
    var penalty = 0;
    if (e.penalita==="nero") penalty = regola("penalita_nero",-3);
    else if (e.penalita==="esterna") penalty = regola("penalita_esterna",-2);
    return {bonus:bonus, penalty:penalty};
  }
  function findAct(episodeId, pred){
    for (var i=0;i<state.activations.length;i++){ var a=state.activations[i]; if (a.episode_id===episodeId && pred(a)) return a; }
    return null;
  }
  function chefContribution(team, concorrenteId, episodeId){
    var bp = basePoints(episodeId, concorrenteId);
    var bonus = bp.bonus, penalty = bp.penalty;
    var spento = findAct(episodeId, function(a){ return a.card_key==="fornelli_spenti" && a.target_team_id===team.id && a.target_concorrente_id===concorrenteId; });
    if (spento) bonus = 0;
    var salvato = findAct(episodeId, function(a){ return (a.card_key==="salvataggio"||a.card_key==="variazione_artusi") && a.team_id===team.id && a.target_concorrente_id===concorrenteId; });
    if (salvato) penalty = 0;
    // Fornelli Spenti: dopo un eventuale annullamento, un'eventuale penalità residua raddoppia.
    if (spento && penalty !== 0) penalty *= 2;
    var total = bonus + penalty;
    var raddoppia = findAct(episodeId, function(a){ return a.card_key==="secondo_intuito" && a.team_id===team.id && a.scelta==="x2" && a.target_concorrente_id===concorrenteId; });
    if (raddoppia) total *= 2;
    var dimezza = findAct(episodeId, function(a){ return a.card_key==="secondo_intuito" && a.target_team_id===team.id && a.scelta==="dimezza" && a.target_concorrente_id===concorrenteId; });
    if (dimezza) total /= 2;
    return total;
  }
  function teamChefsFor(teamId, includeOmbra){
    return state.teamChefs.filter(function(tc){
      if (tc.team_id!==teamId || !tc.attivo) return false;
      if (tc.ruolo==="ombra") return !!includeOmbra;
      return true;
    });
  }
  // Punteggio "pubblico" di una squadra in una puntata: SOLO Brigata (+ eventuali
  // sostituti), MAI lo Chef Ombra. Questo garantisce che lo storico per-puntata
  // (grafici di andamento punteggio/posizione) non venga mai riscritto
  // retroattivamente, nemmeno dopo lo svelamento dell'Ombra.
  function teamEpisodeScore(team, episodeId){
    var chefs = teamChefsFor(team.id, false);
    var ep = byId(state.episodes, episodeId);
    var total = 0;
    chefs.forEach(function(tc){
      // Un Chef entrato con una sostituzione di gennaio non recupera punti
      // dalle puntate precedenti al suo ingresso (parte da 0), anche se lui
      // stesso, come concorrente reale, aveva già eventi in quelle puntate.
      if (tc.da_episodio_numero && ep && ep.numero < tc.da_episodio_numero) return;
      total += chefContribution(team, tc.concorrente_id, episodeId);
    });
    return total;
  }
  // Punteggio accumulato dallo Chef Ombra di una squadra, dalla prima puntata
  // fino a un'eventuale eliminazione: calcolato sempre (così è pronto), ma va
  // sommato al punteggio pubblico della squadra SOLO dopo lo svelamento, in
  // un'unica soluzione — mai spalmato retroattivamente sulle singole puntate.
  function teamOmbraAccumulato(team){
    var ombraChefs = state.teamChefs.filter(function(tc){ return tc.team_id===team.id && tc.attivo && tc.ruolo==="ombra"; });
    if (!ombraChefs.length) return 0;
    var confirmed = state.episodes.filter(function(e){ return e.confermata; });
    var total = 0;
    ombraChefs.forEach(function(tc){
      confirmed.forEach(function(ep){
        if (tc.da_episodio_numero && ep.numero < tc.da_episodio_numero) return;
        total += chefContribution(team, tc.concorrente_id, ep.id);
      });
    });
    return total;
  }
  function computeStandings(){
    var episodes = state.episodes.filter(function(e){ return e.confermata; }).slice().sort(function(a,b){ return a.numero-b.numero; });
    var svelato = !!(state.meta && state.meta.ombra_svelato);
    var rows = state.teams.map(function(t){
      var perEp = episodes.map(function(ep){ return {numero:ep.numero, punti: teamEpisodeScore(t, ep.id)}; });
      var total = Number(t.punti_ingresso||0) + perEp.reduce(function(s,p){ return s+p.punti; },0);
      if (svelato) total += teamOmbraAccumulato(t);
      return {team:t, total:total, perEp:perEp};
    });
    rows.sort(function(a,b){ return b.total-a.total; });
    var pos=0, last=null;
    rows.forEach(function(r,idx){ if (last===null || r.total!==last){ pos=idx+1; last=r.total; } r.pos=pos; });
    return rows;
  }
  // Posizioni come erano subito prima dell'ultima puntata confermata, per mostrare
  // in classifica chi sale/scende. Vuoto se c'è meno di una puntata di storico.
  // Usa la stessa regola di computeStandings per l'Ombra (se già svelata, la somma
  // conta su entrambi i lati del confronto), così la freccia ▲/▼ riflette solo il
  // movimento dovuto all'ultima puntata, non un salto dovuto allo svelamento.
  function standingsDelta(){
    var confirmed = state.episodes.filter(function(e){ return e.confermata; }).slice().sort(function(a,b){ return a.numero-b.numero; });
    if (confirmed.length < 2) return {};
    var prevEpisodes = confirmed.slice(0, -1);
    var svelato = !!(state.meta && state.meta.ombra_svelato);
    var rows = state.teams.map(function(t){
      var total = Number(t.punti_ingresso||0);
      prevEpisodes.forEach(function(ep){ total += teamEpisodeScore(t, ep.id); });
      if (svelato) total += teamOmbraAccumulato(t);
      return {team:t, total:total};
    });
    rows.sort(function(a,b){ return b.total-a.total; });
    var pos=0, last=null, map={};
    rows.forEach(function(r,idx){ if (last===null || r.total!==last){ pos=idx+1; last=r.total; } map[r.team.id]=pos; });
    return map;
  }
  // Posizione in classifica della squadra dopo OGNI puntata confermata, per
  // il grafico "andamento posizione" (diverso dall'andamento del punteggio).
  function positionSeriesFor(teamId){
    var confirmed = state.episodes.filter(function(e){ return e.confermata; }).slice().sort(function(a,b){ return a.numero-b.numero; });
    var series = [];
    for (var i=0; i<confirmed.length; i++){
      var upto = confirmed.slice(0, i+1);
      var rows = state.teams.map(function(t){
        var total = Number(t.punti_ingresso||0);
        upto.forEach(function(ep){ total += teamEpisodeScore(t, ep.id); });
        return {teamId:t.id, total:total};
      });
      rows.sort(function(a,b){ return b.total-a.total; });
      var pos=0, last=null, map={};
      rows.forEach(function(r,idx){ if (last===null || r.total!==last){ pos=idx+1; last=r.total; } map[r.teamId]=pos; });
      series.push({numero: confirmed[i].numero, pos: map[teamId]});
    }
    return series;
  }
  function concorrenteCumulativo(concorrenteId){
    var total = 0;
    state.episodes.filter(function(e){return e.confermata;}).forEach(function(ep){ var bp = basePoints(ep.id, concorrenteId); total += bp.bonus+bp.penalty; });
    return total;
  }
  function displayName(team){
    if (team.nome_squadra) return team.nome_squadra;
    return (team.profiles && team.profiles.display_name) || "Squadra";
  }
  function concorrenteName(id){ var c = byId(state.concorrenti, id); return c?c.nome:"—"; }

  /* ============ stelle / carte: acquisto ============ */
  function starsSpent(teamId){
    return state.purchases.filter(function(p){ return p.team_id===teamId; }).reduce(function(s,p){
      var def = state.cardTypes.filter(function(c){ return c.key===p.card_key; })[0];
      return s + (def?Number(def.costo_stelle):0);
    }, 0);
  }
  function starsRemaining(team){
    return Number(team.stelle_acquistate||1) - starsSpent(team.id);
  }

  /* ============ stelle / carte: utilizzo ============ */
  function draftEpisodes(){
    return state.episodes.filter(function(e){ return !e.confermata; }).slice().sort(function(a,b){ return a.numero-b.numero; });
  }
  function ownActionableChefs(){
    if (!state.myTeam) return [];
    return teamChefsFor(state.myTeam.id, true).filter(function(tc){
      var c = byId(state.concorrenti, tc.concorrente_id);
      return c && !c.eliminato;
    });
  }
  function opponentActionableChefs(){
    if (!state.myTeam) return [];
    return state.teamChefs.filter(function(tc){
      if (tc.team_id===state.myTeam.id || !tc.attivo) return false;
      if (tc.ruolo==="ombra" && !(state.meta && state.meta.ombra_svelato)) return false;
      var c = byId(state.concorrenti, tc.concorrente_id);
      return c && !c.eliminato;
    });
  }
  function artusiTargets(){
    if (!state.myTeam) return [];
    var team = state.myTeam;
    var chefs = teamChefsFor(team.id, true);
    var confirmed = state.episodes.filter(function(e){ return e.confermata; });
    var out = [];
    confirmed.forEach(function(ep){
      chefs.forEach(function(tc){
        var ev = eventFor(ep.id, tc.concorrente_id);
        if (!ev || !ev.penalita) return;
        var already = findAct(ep.id, function(a){
          return (a.card_key==="salvataggio"||a.card_key==="variazione_artusi") && a.team_id===team.id && a.target_concorrente_id===tc.concorrente_id;
        });
        if (already) return;
        out.push({episodeId: ep.id, episodeNumero: ep.numero, concorrenteId: tc.concorrente_id});
      });
    });
    return out;
  }
  function cardWindowInfo(key){
    var reasons = [];
    var draft = draftEpisodes();
    if (key==="fornelli_spenti" || key==="secondo_intuito" || key==="salvataggio"){
      if (!draft.length) reasons.push("Nessuna puntata in bozza al momento.");
    }
    if (key==="fornelli_spenti"){
      if (!(state.meta && state.meta.brigate_visibili)) reasons.push("Le Brigate avversarie non sono ancora visibili.");
      else if (!opponentActionableChefs().length) reasons.push("Nessuno Chef avversario disponibile.");
    } else if (key==="secondo_intuito"){
      var hasOwn = ownActionableChefs().length>0;
      var hasOpp = !!(state.meta && state.meta.brigate_visibili) && opponentActionableChefs().length>0;
      if (!hasOwn && !hasOpp) reasons.push("Nessuno Chef disponibile, né tuo né avversario.");
    } else if (key==="salvataggio"){
      if (!ownActionableChefs().length) reasons.push("La tua Brigata non è ancora stata impostata dall'admin.");
    } else if (key==="variazione_artusi"){
      if (!artusiTargets().length) reasons.push("Nessun tuo Chef ha una penalità in attesa di correzione.");
    }
    return {open: reasons.length===0, reasons: reasons};
  }
  function activationSummary(a){
    var ep = byId(state.episodes, a.episode_id);
    var parts = [];
    if (ep) parts.push("Puntata "+ep.numero);
    if (a.target_concorrente_id){
      var name = concorrenteName(a.target_concorrente_id);
      var t = a.target_team_id ? byId(state.teams, a.target_team_id) : null;
      parts.push(name + (t ? " ("+displayName(t)+")" : ""));
    }
    if (a.scelta) parts.push(a.scelta==="x2" ? "×2" : "÷2");
    return parts.length ? ('<div class="muted" style="font-size:11.5px;margin-top:2px;">'+esc(parts.join(" · "))+'</div>') : "";
  }
  function activationFormHtml(c){
    var key = c.key;
    var draft = draftEpisodes();
    var epOpts = draft.map(function(e){ return '<option value="'+e.id+'">Puntata '+e.numero+'</option>'; }).join("");
    if (key==="fornelli_spenti"){

      return '<div style="display:flex;flex-direction:column;gap:6px;min-width:230px;">'

      var oppOpts2 = opp2.map(function(tc){
        var t = byId(state.teams, tc.team_id);

        + '<label style="font-size:12.5px;"><input type="radio" name="act-mode" value="dimezza"'+(opp2.length?"":" disabled")+'> Dimezza uno Chef avversario</label>'
        + '<select id="act-opp" disabled>'+(opp2.length?oppOpts2:'<option value="">Nessuno disponibile</option>')+'</select>'

      }).join("");
      return '<div style="display:flex;flex-direction:column;gap:6px;min-width:230px;">'
        + '<select id="act-target">'+opts+'</select>'

    return "";
  }

  /* ============ calendario / scadenze ============ */
  // Le scadenze non sono un dato salvato: si calcolano al volo da calendario
  // puntate + regolamento + stato della propria squadra, così restano sempre
  // coerenti con quello che l'utente può davvero ancora fare.
  function fmtEpWhen(ep){
    if (!ep || !ep.data) return "";
    var base = fmtDate(ep.data);
    if (ep.ora){ return base + " alle " + String(ep.ora).slice(0,5); }
    return base;
  }
  function epSortKey(ep){
    return new Date(ep.data + "T" + (ep.ora ? ep.ora : "00:00") + ":00");
  }
  function computeScadenze(){
    var items = [];
    var draft = draftEpisodes();
    var nextEp = (draft.length && draft[0].data) ? draft[0] : null;
    if (nextEp){
      items.push({label: "Puntata " + nextEp.numero + " in onda", when: fmtEpWhen(nextEp), sortKey: epSortKey(nextEp)});
    }
    if (state.myTeam && nextEp){
      var myPurchases = state.purchases.filter(function(p){ return p.team_id===state.myTeam.id; });
      ["fornelli_spenti","secondo_intuito","salvataggio"].forEach(function(key){
        var owned = myPurchases.some(function(p){ return p.card_key===key; });
        if (!owned) return;
        var used = state.activations.some(function(a){ return a.team_id===state.myTeam.id && a.card_key===key; });
        if (used) return;
        var win = cardWindowInfo(key);
        if (!win.open) return;
        var def = state.cardTypes.filter(function(c){ return c.key===key; })[0];
        items.push({
          label: 'Usa "' + (def?def.label:key) + '" entro Puntata ' + nextEp.numero,
          when: fmtEpWhen(nextEp),
          sortKey: epSortKey(nextEp)
        });
      });
    }
    if (state.meta && state.meta.ombra_svelato===false && state.meta.data_svelamento){
      var reveal = new Date(state.meta.data_svelamento + "T00:00:00");
      var daysLeft = Math.ceil((reveal - new Date()) / 86400000);
      if (daysLeft>=0 && daysLeft<=30){
        items.push({label: "Lo Chef Ombra viene svelato", when: fmtDate(state.meta.data_svelamento), sortKey: reveal});
      }
    }
    items.sort(function(a,b){ return a.sortKey - b.sortKey; });
    return items;
  }
  function scadenzeHtml(items){
    if (!items.length) return "";
    return '<div class="notice">'
      + '<div class="notice-head"><img class="notice-icon" src="char-scadenza.png" alt="">Da non perdere</div>'
      + items.map(function(it){
          return '<div class="notice-item"><span>'+esc(it.label)+'</span><span class="notice-when">'+esc(it.when)+'</span></div>';
        }).join("")
      + '</div>';
  }
  function fmtDeadline(d){
    if (!d || isNaN(d)) return "";
    var datePart = d.toLocaleDateString("it-IT", {day:"numeric", month:"long", year:"numeric"});
    if (d.getHours()===0 && d.getMinutes()===0) return datePart;
    return datePart + " alle " + d.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
  }
  // La Brigata iniziale è modificabile liberamente finché non scatta la
  // scadenza: quella personale (per chi entra in ritardo, impostata
  // dall'Admin) se presente, altrimenti l'inizio della prima puntata. In
  // più, se l'Admin rende le Brigate visibili a tutti, si considera comunque
  // bloccata da quel momento (coerente con "diventa visibile a tutti
  // all'inizio della prima puntata").
  function brigataDeadlineFor(team){
    if (!team) return null;
    if (team.brigata_scadenza_personale) return new Date(team.brigata_scadenza_personale + "T00:00:00");
    var ep1 = state.episodes.filter(function(e){ return e.numero===1 && e.data; })[0];
    if (!ep1) return null;
    return epSortKey(ep1);
  }
  function brigataLocked(team){
    if (!team) return true;
    if (state.meta && state.meta.brigate_visibili) return true;
    var dl = brigataDeadlineFor(team);
    if (!dl) return false;
    return new Date() >= dl;
  }

  // Sostituzione di gennaio: possibile UNA sola volta a stagione, solo se la
  // squadra ha in Brigata almeno un Chef eliminato, entro la stessa data
  // fissa di svelamento dell'Ombra (31/01) — la stessa validazione è anche
  // nel database (trigger), questa è solo per mostrare/nascondere la UI.
  function sostituzioneDeadline(){
    if (!state.meta || !state.meta.data_svelamento) return null;
    return new Date(state.meta.data_svelamento + "T00:00:00");
  }
  function sostituzioneClosed(){
    var dl = sostituzioneDeadline();
    return dl ? (new Date() >= dl) : false;
  }
  function teamHasEliminatoInBrigata(team){
    if (!team) return false;
    return teamChefsFor(team.id, false).some(function(tc){
      if (tc.ruolo!=="brigata") return false;
      var c = byId(state.concorrenti, tc.concorrente_id);
      return c && c.eliminato;
    });
  }
  function sostituzioneEligible(team){
    return !!team && !team.sostituzione_usata && !sostituzioneClosed() && teamHasEliminatoInBrigata(team);
  }
  function sostituzioneFormHtml(team){
    var eliminatiInBrigata = teamChefsFor(team.id, false).filter(function(tc){
      if (tc.ruolo!=="brigata") return false;
      var c = byId(state.concorrenti, tc.concorrente_id);
      return c && c.eliminato;
    });
    var oldOpts = eliminatiInBrigata.map(function(tc){ return '<option value="'+tc.concorrente_id+'">'+esc(concorrenteName(tc.concorrente_id))+'</option>'; }).join("");
    var ownIds = teamChefsFor(team.id, true).map(function(tc){ return tc.concorrente_id; });
    var eligibili = state.concorrenti.filter(function(c){ return !c.eliminato && ownIds.indexOf(c.id)===-1; });
    var newOpts = eligibili.map(function(c){ return '<option value="'+c.id+'">'+esc(c.nome)+'</option>'; }).join("");
    return '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;max-width:320px;">'
      + '<label class="field"><span>Chef eliminato che stai sostituendo</span><select id="sost-old">'+oldOpts+'</select></label>'
      + '<label class="field"><span>Nuovo Chef</span><select id="sost-new">'+(newOpts||'<option value="">Nessuno disponibile</option>')+'</select></label>'
      + '<p class="section-sub" style="color:var(--penalty);">Attenzione: è definitiva e irrevocabile, non esiste una seconda sostituzione. Il nuovo Chef parte da 0 punti; quelli già fatti dal vecchio Chef restano acquisiti.</p>'
      + '<div><button class="btn sm primary" id="sq-confirm-sostituzione">Conferma sostituzione (10€)</button> <button class="btn sm ghost" id="sq-cancel-sostituzione">Annulla</button></div>'
      + '</div>';
  }

  /* ============ tabs ============ */
  // Voci "secondarie" raccolte nel menu a tendina "Altro" del bottombar, per
  // non affollare la barra su schermi stretti (richiesto dall'utente).
  var OVERFLOW_TABS = ["concorrenti","puntate","regolamento","admin"];
  function selectTab(tab){
    var leavingChat = state.activeTab==="chat" && tab!=="chat";
    state.activeTab = tab;
    var appRoot = document.getElementById("app");
    if (appRoot) appRoot.classList.toggle("home-active", tab === "home");
    document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.getAttribute("data-panel")===tab); });
    document.querySelectorAll(".bottombar button[data-tab]").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===tab); });
    var moreBtn = document.getElementById("more-nav-btn");
    if (moreBtn) moreBtn.classList.toggle("active", OVERFLOW_TABS.indexOf(tab)!==-1);
    var morePanel = document.getElementById("more-panel");
    if (morePanel) morePanel.classList.add("hidden");
    window.scrollTo(0,0);
    if (tab==="chat"){
      state._chatScrollPending = true;
      loadChatData();
      markChatRead();
      if (state.chatPollTimer) clearInterval(state.chatPollTimer);
      state.chatPollTimer = setInterval(loadChatData, 20000);
    } else if (leavingChat && state.chatPollTimer){
      clearInterval(state.chatPollTimer);
      state.chatPollTimer = null;
    }
    updateChatBadge();
  }
  document.getElementById("bottombar").addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if (b) selectTab(b.getAttribute("data-tab"));
  });
  // Menu "Altro": si apre/chiude al tocco e si chiude da solo toccando
  // altrove o scegliendo una voce (quest'ultimo già gestito in selectTab).
  document.getElementById("more-nav-btn").addEventListener("click", function(e){
    e.stopPropagation();
    document.getElementById("more-panel").classList.toggle("hidden");
  });
  document.addEventListener("click", function(e){
    var panel = document.getElementById("more-panel");
    if (!panel || panel.classList.contains("hidden")) return;
    if (e.target.closest("#more-panel") || e.target.closest("#more-nav-btn")) return;
    panel.classList.add("hidden");
  });
